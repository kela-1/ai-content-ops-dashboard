<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Ops — AI Character Production Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#141414;
--border:#2a2a2a;--text:#e8e8e8;--text2:#888;--text3:#555;
--card-bg:#1a1a1a;--inp-bg:#111;
--btn-ghost-bg:transparent;--btn-ghost-border:#2a2a2a;--btn-ghost-color:#888;
--btn-ghost-hover-bg:#1e1e1e;--btn-ghost-hover-color:#e8e8e8;
--btn-primary-bg:#e8e8e8;--btn-primary-color:#0f0f0f;
--nav-active:#e8e8e8;--nav-inactive:#444;
--stat-bg:#141414;--row-div:#1e1e1e;
--tag-bg:#1e1e1e;--tag-color:#888;--tag-border:#2a2a2a;
--dz-bg:#0a0a0a;--dz-border:#222;--dz-color:#333;
--modal-bg:#141414;--modal-border:#2a2a2a;
--conf-bg:#0f0f0f;--conf-border:#2a2a2a;
--arch-bg:#141414;--arch-border:#222;
--uncat-bg:#221800;--uncat-color:#BA7517;--uncat-border:#3a2800;
--amber-bg:#1a1200;--amber-border:#2a1e00;
--char-tab-bg:#141414;--char-tab-border:#222;--char-tab-color:#555;
--char-tab-active-bg:#1e1e1e;--char-tab-active-border:#2a2a2a;--char-tab-active-color:#e8e8e8;
--cat-badge-bg:#1e1e1e;--cat-badge-color:#555;
--prod-tag-bg:#1a2a1a;--prod-tag-color:#1D9E75;--prod-tag-border:#1D9E7544;
--bg-tag-bg:#1a1a2a;--bg-tag-color:#7F77DD;--bg-tag-border:#7F77DD44;
--edit-highlight:#7F77DD22;--edit-border:#7F77DD55;
}
.light-mode{
--bg:#f5f5f2;--bg2:#fff;--bg3:#eeeee9;
--border:#e0e0da;--text:#1a1a1a;--text2:#666;--text3:#aaa;
--card-bg:#fff;--inp-bg:#fff;
--btn-ghost-bg:transparent;--btn-ghost-border:#d0d0ca;--btn-ghost-color:#666;
--btn-ghost-hover-bg:#eeeee9;--btn-ghost-hover-color:#1a1a1a;
--btn-primary-bg:#1a1a1a;--btn-primary-color:#f5f5f2;
--nav-active:#1a1a1a;--nav-inactive:#bbb;
--stat-bg:#eeeee9;--row-div:#eee;
--tag-bg:#eeeee9;--tag-color:#666;--tag-border:#d8d8d2;
--dz-bg:#f0f0ec;--dz-border:#ccc;--dz-color:#bbb;
--modal-bg:#fff;--modal-border:#e0e0da;
--conf-bg:#fff;--conf-border:#e0e0da;
--arch-bg:#f8f8f4;--arch-border:#e0e0da;
--uncat-bg:#fff8e6;--uncat-color:#854F0B;--uncat-border:#f0c060;
--amber-bg:#fff8e6;--amber-border:#f0c060;
--char-tab-bg:#eeeee9;--char-tab-border:#d8d8d2;--char-tab-color:#999;
--char-tab-active-bg:#fff;--char-tab-active-border:#ccc;--char-tab-active-color:#1a1a1a;
--cat-badge-bg:#eeeee9;--cat-badge-color:#888;
--prod-tag-bg:#e8f5f0;--prod-tag-color:#0F6E56;--prod-tag-border:#9FE1CB;
--bg-tag-bg:#EEEDFE;--bg-tag-color:#534AB7;--bg-tag-border:#AFA9EC;
--edit-highlight:#7F77DD11;--edit-border:#7F77DD44;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.2s,color 0.2s}
.card{background:var(--card-bg);border-color:var(--border)}
.muted{color:var(--text2)}
.sl{color:var(--text3);font-size:10px;letter-spacing:0.5px;text-transform:uppercase;font-weight:500}
.nav-btn{background:none;border:none;border-bottom:2px solid transparent;padding:9px 13px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--nav-inactive);font-family:inherit;transition:color 0.15s}
.nav-btn.active{color:var(--nav-active);border-bottom-color:var(--nav-active)}
.nav-btn:hover{color:var(--text)}
.stat-block{background:var(--stat-bg);border-radius:8px;padding:13px 15px;flex:1;min-width:0}
.btn-ghost{background:var(--btn-ghost-bg);border:0.5px solid var(--btn-ghost-border);color:var(--btn-ghost-color);font-family:inherit;cursor:pointer;border-radius:8px;font-size:13px;padding:8px 14px;transition:all 0.15s}
.btn-ghost:hover{background:var(--btn-ghost-hover-bg);color:var(--btn-ghost-hover-color)}
.btn-primary{background:var(--btn-primary-bg);color:var(--btn-primary-color);border:none;font-family:inherit;cursor:pointer;border-radius:8px;font-size:13px;padding:8px 14px;font-weight:500;transition:all 0.15s}
.row-div{border-bottom:0.5px solid var(--row-div)}
.del-x{background:none;border:none;font-size:18px;padding:0 4px;cursor:pointer;line-height:1;color:var(--text3);font-family:inherit;transition:color 0.15s}
.del-x:hover{color:#e24b4a}
.dz{background:var(--dz-bg);border:1.5px dashed var(--dz-border);color:var(--dz-color);border-radius:7px;padding:10px;text-align:center;cursor:pointer;transition:all 0.15s;outline:none}
.dz:hover,.dz.over,.dz:focus{border-color:#7F77DD;color:#7F77DD}
.dz.has-img{border-color:#1D9E75;color:#1D9E75}
.char-tab{background:var(--char-tab-bg);border:0.5px solid var(--char-tab-border);color:var(--char-tab-color);font-family:inherit;cursor:pointer;border-radius:20px;font-size:13px;padding:7px 14px;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s}
.char-tab.active{background:var(--char-tab-active-bg);border-color:var(--char-tab-active-border);color:var(--char-tab-active-color)}
.cat-badge{background:var(--cat-badge-bg);color:var(--cat-badge-color);font-size:10px;padding:3px 8px;border-radius:20px}
.uncat-badge{background:var(--uncat-bg);color:var(--uncat-color);border:0.5px solid var(--uncat-border);font-size:10px;padding:3px 8px;border-radius:20px}
.prod-tag-sm{background:var(--prod-tag-bg);color:var(--prod-tag-color);border:0.5px solid var(--prod-tag-border);font-size:10px;padding:2px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:3px}
.bg-tag-sm{background:var(--bg-tag-bg);color:var(--bg-tag-color);border:0.5px solid var(--bg-tag-border);font-size:10px;padding:2px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:3px}
.thumb-wrap{position:relative;display:inline-flex;flex-shrink:0}
.thumb-wrap .hprev{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:160px;height:160px;border-radius:10px;object-fit:cover;z-index:9999;pointer-events:none;border:2px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.thumb-wrap:hover .hprev{display:block}
.no-thumb{display:flex;align-items:center;justify-content:center;border-radius:7px;flex-shrink:0;font-size:14px;opacity:0.2}
.inp{background:var(--inp-bg);border:0.5px solid var(--border);color:var(--text);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;width:100%;outline:none;transition:border-color 0.15s}
.inp:focus{border-color:#7F77DD}
.tag-sel{background:var(--inp-bg);border:0.5px solid var(--border);color:var(--text2);border-radius:20px;padding:2px 8px;font-size:11px;font-family:inherit;cursor:pointer;outline:none}
.clickable-card{cursor:pointer;transition:border-color 0.15s}
.clickable-card:hover{border-color:var(--text3)!important}
.edit-card{background:var(--edit-highlight)!important;border-color:var(--edit-border)!important}
.prod-link-btn{background:none;border:none;color:#7F77DD;font-size:11px;cursor:pointer;text-align:left;padding:0;font-family:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;display:block}
.prod-link-btn:hover{text-decoration:underline}
#nav-wrap{padding:16px 20px 0;border-bottom:0.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100}
#content{padding:20px;max-width:1200px;margin:0 auto}
#toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#conf-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:9998;align-items:center;justify-content:center;padding:20px}
#modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9997;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
/* Hide native number input spinners — looked dated */
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
/* Calendar / picker chevron — modernize for date inputs */
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.55);cursor:pointer;opacity:0.6;transition:opacity 0.15s}
input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:1}
.light-mode input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.4)}
/* Spinner for the generate-video status panel */
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="nav-wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div>
      <div style="font-size:15px;font-weight:500;letter-spacing:-0.3px;color:var(--text)">content ops</div>
      <div class="muted" style="font-size:12px;margin-top:1px">ai character production tracker</div>
    </div>
    <button class="btn-primary" onclick="openModal('video')" style="padding:7px 16px;font-size:12px;border-radius:20px">+ add video</button>
  </div>
  <div style="display:flex;gap:0;overflow-x:auto">
    <button class="nav-btn active" onclick="setView('overview')">overview</button>
    <button class="nav-btn" onclick="setView('characters')">characters</button>
    <button class="nav-btn" onclick="setView('products')">products</button>
    <button class="nav-btn" onclick="setView('motions')">motions</button>
    <button class="nav-btn" onclick="setView('angles')">angles</button>
    <button class="nav-btn" onclick="setView('generate')">generate</button>
    <button class="nav-btn" onclick="setView('inbox')">inbox</button>
    <button class="nav-btn" onclick="setView('earnings')">earnings</button>
    <button class="nav-btn" onclick="setView('import')">import data</button>
    <button class="nav-btn" onclick="setView('tools')">tools</button>
    <button class="nav-btn" onclick="setView('settings')">settings</button>
    <button class="nav-btn" onclick="setView('history')">history</button>
  </div>
</div>

<div id="content"></div>
<div id="toast-wrap"></div>
<div id="conf-wrap">
  <div id="conf-box" style="border-radius:14px;padding:26px;max-width:420px;width:100%;background:var(--conf-bg);border:0.5px solid var(--conf-border)">
    <div id="conf-inner"></div>
  </div>
</div>
<div id="modal-wrap">
  <div id="modal-box" style="border-radius:14px;padding:24px;width:100%;max-width:490px;background:var(--modal-bg);border:0.5px solid var(--modal-border);margin:auto">
    <div id="modal-inner"></div>
  </div>
</div>

<script>
// === Higgsfield proxy config ===
// Edit PROXY_BASE if the Vercel deploy URL changes. PROXY_SECRET lives in
// localStorage and is prompted once per browser. Defaults below match the
// SaaS thesis (Memify-style 9:16 short clips on Kling 3.0).
var PROXY_BASE='https://aiops-proxy.vercel.app/api';
var GEN_DEFAULTS={task:'text-to-video',model:'kling-3.0',duration:5,aspect_ratio:'9:16'};
function getProxySecret(){var s=localStorage.getItem('aicops_proxy_secret');if(!s){s=prompt('Enter the proxy secret (one-time setup):');if(!s)return null;s=s.trim();localStorage.setItem('aicops_proxy_secret',s);}return s;}
function clearProxySecret(){localStorage.removeItem('aicops_proxy_secret');showToast('proxy secret cleared — next generate will re-prompt','muted');}

// === Gmail / Google OAuth config ===
// Paste your Google OAuth Client ID from console.cloud.google.com (Credentials).
// Format: "123456789-abc...xyz.apps.googleusercontent.com". This is PUBLIC — safe
// to commit. The Client Secret stays in .env, NOT here.
var GOOGLE_CLIENT_ID='493944122528-7f3hg4fpnu1juqb8a33f9nleac7d68f1.apps.googleusercontent.com';
var GMAIL_SCOPES='https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/userinfo.email';
var gmailTokenClient=null;

var STORE_KEY='aicops_data';
var HIST_KEY='aicops_history';
var S={
  theme:'dark',view:'overview',selChar:null,pf:'all',ptf:'all',pfav:'all',bgFav:'all',
  mtf:'all',atf:'all',mfav:'all',afav:'all',viewAs:null,
  editingVideo:null,editingProduct:null,editingBg:null,editingMotion:null,editingAngle:null,editingModelImage:null,
  characters:[
    {id:'lena',name:'Lena',color:'#7F77DD',archived:false,description:'',favorites:{products:[],backgrounds:[],motions:[],angles:[]}},
    {id:'zoe',name:'Zoe',color:'#1D9E75',archived:false,description:'',favorites:{products:[],backgrounds:[],motions:[],angles:[]}},
    {id:'jessica',name:'Jessica',color:'#D85A30',archived:false,description:'',favorites:{products:[],backgrounds:[],motions:[],angles:[]}}
  ],
  videos:[],products:[],backgrounds:[],motions:[],angles:[],modelImages:[],dailyLedger:[],ledgerExpanded:false,
  gmailEmail:null,emails:[],activeEmailId:null,composingReply:null,emailListLoading:false,
  gen:{character:null,modelImage:null,background:null,motion:null,angle:null,products:[],customPrompt:''},blueprints:[],savingBlueprint:null,
  earnRange:'thisMonth',earnMetric:'commission',
  bgTags:['City','Night','Bedroom','Gym','Bathroom','Mirror'],
  prodCats:['tops','pants','shoes','jewelry','accessories','other'],
  prodTags:['black','white','red','blue','green','hoodie','dress','casual','sport'],
  motionTags:['walking','standing','sitting','turning','gesture','intro','closeup'],
  angleTags:['wide','closeup','low-angle','high-angle','side','front','back'],
  modelImageTags:['portrait','full-body','casual','studio','pose']
};
var HISTORY=[],UNDO_STACK=[],REDO_STACK=[];

function save(){try{var d=JSON.parse(JSON.stringify(S));delete d.view;delete d.editingVideo;delete d.editingProduct;delete d.editingBg;delete d.editingMotion;delete d.editingAngle;delete d.editingModelImage;delete d.ptf;delete d.statusFilter;delete d.pfav;delete d.bgFav;delete d.mtf;delete d.atf;delete d.mfav;delete d.afav;delete d.savingBlueprint;delete d.ttsModal;delete d.emailListLoading;localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){console.error('localStorage save failed (probably over 5MB cap):',e.message);if(typeof showToast==='function')showToast('save failed: storage full — try removing old images','red');}}
function saveHistory(){try{localStorage.setItem(HIST_KEY,JSON.stringify(HISTORY.slice(0,1000)));}catch(e){}}
function load(){
  try{
    var keys=[STORE_KEY,'aicops_v6','aicops_v5','aicops_v4','aicops_v3'];
    var d=null;for(var i=0;i<keys.length;i++){d=localStorage.getItem(keys[i]);if(d)break;}
    if(d){
      var p=JSON.parse(d);Object.keys(p).forEach(function(k){if(k in S)S[k]=p[k];});
      if(!S.prodTags)S.prodTags=['black','white','red','blue','green','hoodie','dress','casual','sport'];
      if(!S.bgTags)S.bgTags=['City','Night','Bedroom','Gym','Bathroom','Mirror'];
      if(!S.prodCats)S.prodCats=['tops','pants','shoes','jewelry','accessories','other'];
      S.characters.forEach(function(c){
        if(c.archived===undefined)c.archived=false;
        if(typeof c.description!=='string')c.description='';
        if(!c.favorites)c.favorites={products:[],backgrounds:[],motions:[],angles:[]};
        ['products','backgrounds','motions','angles'].forEach(function(k){if(!Array.isArray(c.favorites[k]))c.favorites[k]=[];});
      });
      if(!S.gen||typeof S.gen!=='object')S.gen={character:null,modelImage:null,background:null,motion:null,angle:null,products:[],customPrompt:''};
      if(!Array.isArray(S.gen.products))S.gen.products=[];
      if(!('modelImage' in S.gen))S.gen.modelImage=null;
      if(typeof S.gen.customPrompt!=='string')S.gen.customPrompt='';
      if(!Array.isArray(S.modelImages))S.modelImages=[];
      if(!Array.isArray(S.modelImageTags))S.modelImageTags=['portrait','full-body','casual','studio','pose'];
      if(!Array.isArray(S.emails))S.emails=[];
      if(typeof S.gmailEmail==='undefined')S.gmailEmail=null;
      if(typeof S.activeEmailId==='undefined')S.activeEmailId=null;
      if(typeof S.composingReply==='undefined')S.composingReply=null;
      // Per-character mailing address for free-sample auto-replies
      S.characters.forEach(function(c){if(typeof c.mailingAddress!=='string')c.mailingAddress='';});
      S.modelImages.forEach(function(mi){if(!Array.isArray(mi.tags))mi.tags=[];});
      S.products.forEach(function(p){if(!p.tags)p.tags=[];});
      S.backgrounds.forEach(function(b){if(!b.tags)b.tags=[];});
      // Migrate: posted field defaults to null (unknown) for older videos; engagement fields default to null
      S.videos.forEach(function(v){if(!('posted' in v))v.posted=null;if(!('revenue' in v))v.revenue=null;['views','likes','comments','shares','saves','totalPlayTime','avgWatchTime','watchFullPct','newFollowers'].forEach(function(k){if(!(k in v))v[k]=null;});});
      if(!Array.isArray(S.blueprints))S.blueprints=[];
      if(!Array.isArray(S.dailyLedger))S.dailyLedger=[];
      // Revenue migration on ledger
      S.dailyLedger.forEach(function(e){if(!('gmv' in e))e.gmv=null;if(!('itemsSold' in e))e.itemsSold=null;if(!('commission' in e))e.commission=null;if(!('rangeStart' in e))e.rangeStart=null;if(!('rangeEnd' in e))e.rangeEnd=null;});
      if(!Array.isArray(S.motions))S.motions=[];
      if(!Array.isArray(S.angles))S.angles=[];
      if(!Array.isArray(S.motionTags))S.motionTags=['walking','standing','sitting','turning','gesture','intro','closeup'];
      if(!Array.isArray(S.angleTags))S.angleTags=['wide','closeup','low-angle','high-angle','side','front','back'];
      S.motions.forEach(function(m){if(!Array.isArray(m.tags))m.tags=[];if(typeof m.promptSnippet!=='string')m.promptSnippet='';});
      S.angles.forEach(function(a){if(!Array.isArray(a.tags))a.tags=[];if(typeof a.promptSnippet!=='string')a.promptSnippet='';});
    }
  }catch(e){}
  try{var h=localStorage.getItem(HIST_KEY);if(h)HISTORY=JSON.parse(h);}catch(e){}
}

function ts(){return new Date().toLocaleString();}
function logH(a,d){HISTORY.unshift({action:a,detail:d,time:ts()});saveHistory();}
function pushUndo(u,r,l){UNDO_STACK.push({undoFn:u,redoFn:r,label:l});if(UNDO_STACK.length>50)UNDO_STACK.shift();REDO_STACK=[];}
function doUndo(){if(!UNDO_STACK.length){showToast('nothing to undo','muted');return;}var i=UNDO_STACK.pop();i.undoFn();REDO_STACK.push(i);logH('undo','undid: '+i.label);showToast('undone: '+i.label,'amber');save();render();}
function doRedo(){if(!REDO_STACK.length){showToast('nothing to redo','muted');return;}var i=REDO_STACK.pop();i.redoFn();UNDO_STACK.push(i);logH('redo','redid: '+i.label);showToast('redid: '+i.label,'purple');save();render();}
document.addEventListener('keydown',function(e){var m=e.ctrlKey||e.metaKey;if(!m)return;if(e.key==='z'&&!e.shiftKey){e.preventDefault();doUndo();}if(e.key==='z'&&e.shiftKey){e.preventDefault();doRedo();}if(e.key==='y'){e.preventDefault();doRedo();}});

function showToast(msg,type){
  var wrap=document.getElementById('toast-wrap');if(!wrap)return;
  var col=type==='green'?'#1D9E75':type==='red'?'#e24b4a':type==='amber'?'#BA7517':type==='purple'?'#7F77DD':'var(--text2)';
  var el=document.createElement('div');
  el.style.cssText='border-radius:20px;padding:8px 18px;font-size:12px;font-weight:500;color:'+col+';background:var(--modal-bg);border:0.5px solid var(--border);pointer-events:none;transition:opacity 0.3s';
  el.textContent=msg;wrap.appendChild(el);
  setTimeout(function(){el.style.opacity='0';setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},400);},2500);
}

function applyTheme(){if(S.theme==='light')document.body.classList.add('light-mode');else document.body.classList.remove('light-mode');}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';save();render();}

function setView(v){
  S.view=v;S.editingVideo=null;S.editingProduct=null;S.editingBg=null;S.editingMotion=null;S.editingAngle=null;S.editingModelImage=null;
  document.querySelectorAll('.nav-btn').forEach(function(btn){var map={'overview':'overview','characters':'characters','products':'products','motions':'motions','angles':'angles','generate':'generate','earnings':'earnings','import data':'import','tools':'tools','settings':'settings','history':'history'};btn.classList.toggle('active',map[btn.textContent.trim()]===v);});
  render();
}

function gc(id){return S.characters.find(function(c){return c.id===id;})||{name:'?',color:'#888',id:'?',archived:false};}
function tc(v){return (v.imageCredits||0)+(v.videoCredits||0);}
function activeChars(){return S.characters.filter(function(c){return !c.archived;});}
function allCats(){return S.prodCats.concat(['uncategorized']);}

// CASE-INSENSITIVE character lookup
function findCharacter(nameOrId){
  if(!nameOrId)return null;
  var q=nameOrId.toLowerCase().trim();
  return S.characters.find(function(c){return c.id===q||c.name.toLowerCase()===q;})||null;
}

function fuzzy(str,list){
  if(!str||!list||!list.length)return null;
  var s=str.toLowerCase().replace(/[\s\-_]/g,'');var best=null,bs=0;
  list.forEach(function(item){
    var t=(item.name||'').toLowerCase().replace(/[\s\-_]/g,'');
    if(t===s){best=item;bs=1;return;}
    var sh=s.length<t.length?s:t,lo=s.length<t.length?t:s;
    if(lo.indexOf(sh)>-1){var sc=sh.length/lo.length;if(sc>bs){bs=sc;best=item;}}
    var com=0;for(var i=0;i<Math.min(s.length,t.length);i++){if(s[i]===t[i])com++;}
    var sc2=com/Math.max(s.length,t.length,1);if(sc2>bs&&sc2>=0.75){bs=sc2;best=item;}
  });
  return best;
}

function todayStr(){return new Date().toISOString().slice(0,10);}
// getDailyEntry returns ONLY single-day entries (no rangeStart). Range entries are handled separately.
function getDailyEntry(charId,date){return S.dailyLedger.find(function(e){return e.character===charId&&e.date===date&&!e.rangeStart;});}
function upsertDailyEntry(charId,date,patch){var e=getDailyEntry(charId,date);if(!e){e={id:Date.now()+Math.floor(Math.random()*9999),character:charId,date:date,startBalance:null,endBalance:null,gmv:null,itemsSold:null,commission:null,rangeStart:null,rangeEnd:null,note:''};S.dailyLedger.push(e);}Object.assign(e,patch);return e;}
function dailyEntriesForChar(charId){return S.dailyLedger.filter(function(e){return e.character===charId;}).sort(function(a,b){var ad=(a.rangeEnd||a.date),bd=(b.rangeEnd||b.date);return ad<bd?1:ad>bd?-1:0;});}
function rangeEntriesForChar(charId){return S.dailyLedger.filter(function(e){return e.character===charId&&e.rangeStart;});}
// "Effective" per-day value for charts. Daily entry takes precedence over any range covering that date.
// If there's no daily entry, distribute range values evenly across their days.
function getEffectiveDaily(charId,date){
  var d=getDailyEntry(charId,date);
  if(d){return {gmv:Number(d.gmv)||0,itemsSold:Number(d.itemsSold)||0,commission:Number(d.commission)||0};}
  var r={gmv:0,itemsSold:0,commission:0};
  rangeEntriesForChar(charId).forEach(function(e){
    var rs=e.rangeStart,re=e.rangeEnd||e.date;
    if(date<rs||date>re)return;
    var days=Math.round((new Date(re)-new Date(rs))/86400000)+1;
    if(days<=0)return;
    r.gmv+=(Number(e.gmv)||0)/days;
    r.itemsSold+=(Number(e.itemsSold)||0)/days;
    r.commission+=(Number(e.commission)||0)/days;
  });
  return r;
}
function ledgerSpent(e){if(e==null||e.startBalance==null||e.endBalance==null)return null;return e.startBalance-e.endBalance;}
function videoCreditsOnDate(charId,date){return S.videos.filter(function(v){return v.character===charId&&v.date===date;}).reduce(function(a,v){return a+tc(v);},0);}
function setLedgerField(charId,date,field,raw){
  var val=raw==null||raw===''?null:Number(raw);if(isNaN(val))val=null;
  var prev=getDailyEntry(charId,date);
  var oldExisted=!!prev;var oldVal=prev?prev[field]:undefined;
  upsertDailyEntry(charId,date,(function(){var p={};p[field]=val;return p;})());
  pushUndo(function(){if(!oldExisted){S.dailyLedger=S.dailyLedger.filter(function(e){return !(e.character===charId&&e.date===date);});}else{var e=getDailyEntry(charId,date);if(e)e[field]=oldVal;}},function(){upsertDailyEntry(charId,date,(function(){var p={};p[field]=val;return p;})());},'ledger '+date+' '+field+'='+(val==null?'—':val));
  logH('edit','ledger '+date+' '+field+'='+(val==null?'—':val));

}

// === Charts ===
// Hand-rolled SVG so we don't pull in a charting library. Returns a string.
function lastNDates(n){var out=[];var t=new Date();for(var i=n-1;i>=0;i--){var d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-i);out.push(d.toISOString().slice(0,10));}return out;}
function renderCreditUsageChart(){
  var dates=lastNDates(30);
  var chars=activeChars();
  if(!chars.length||!S.videos.length)return '';
  var series=chars.map(function(c){return {label:c.name,color:c.color,data:dates.map(function(d){return videoCreditsOnDate(c.id,d);})};});
  var allVals=[].concat.apply([],series.map(function(s){return s.data;}));
  var maxVal=Math.max.apply(null,allVals);
  if(maxVal<=0)return '';
  var yMax=Math.ceil(maxVal*1.15/10)*10;if(yMax<10)yMax=10;
  var W=720,H=200,padL=36,padR=12,padT=16,padB=22;
  function xC(i){return padL+(i/(dates.length-1))*(W-padL-padR);}
  function yC(v){return H-padB-(v/yMax)*(H-padT-padB);}
  var paths=series.map(function(s){
    if(!s.data.some(function(v){return v>0;}))return '';
    var d=s.data.map(function(v,i){return (i===0?'M':'L')+xC(i).toFixed(1)+','+yC(v).toFixed(1);}).join(' ');
    return '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>';
  }).join('');

// === TTS Screenshot OCR (Tesseract.js, lazy-loaded) ===
var tesseractPromise=null;
function ensureTesseract(){
  if(tesseractPromise)return tesseractPromise;
  tesseractPromise=new Promise(function(resolve,reject){
    if(window.Tesseract){resolve(window.Tesseract);return;}
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=function(){resolve(window.Tesseract);};
    s.onerror=function(){tesseractPromise=null;reject(new Error('failed to load OCR engine — check internet'));};
    document.head.appendChild(s);
  });
  return tesseractPromise;
}
function parseAmount(numStr,suffix){
  if(numStr==null)return null;
  var n=parseFloat(String(numStr).replace(/,/g,''));
  if(isNaN(n))return null;
  if(suffix){var s=String(suffix).toLowerCase();if(s==='k')return n*1000;if(s==='m')return n*1000000;}
  return n;
}
function parseNumWithSuffix(s){if(!s)return null;var m=String(s).match(/([\d,.]+)\s*([kKmM])?/);if(!m)return null;return parseAmount(m[1],m[2]);}

// Classify what type of TTS/TikTok screenshot this is from OCR text.
function detectScreenshotType(text){
  var t=text.toLowerCase();
  // Per-video signals (TikTok Studio video analysis page)
  if(/(video\s+views|total\s+play\s+time|est(?:imated)?\s+rewards|average\s+watch\s+time|watched\s+full\s+video|new\s+followers)/.test(t))return 'video';
  // Daily aggregate signals (TTS Shop home / Data view)
  if(/((?:attr\.?|commission)\s*gmv|items?\s+sold|est(?:\.|imated)?\s+commissions?|commission\s+base)/.test(t))return 'daily';
  return 'unknown';
}

// Parse a TTS Shop daily-aggregate screenshot.
// Three layouts to handle:
//   1. Shop Home: 3-column row-major. "Attr. GMV / Attr. items sold / Est. commission" then "$X / N / $Y"
//   2. Data Overview: 2x2 grid, no commission visible
//   3. Data Commissions: 2x2 grid, "Commission base" + "Est. commissions" pair, want only the latter
// Tesseract typically serializes row-major (labels-row then values-row), which interleaves columns.
function parseDailyScreenshot(text){
  var t=text.replace(/[\r\n]+/g,' ').replace(/\s+/g,' ');

  // GMV — first $ amount after the GMV label.
  var gmvMatch=t.match(/(?:attr\.?|commission)?\s*gmv[^$]{0,80}\$\s*([\d,]+(?:\.\d+)?)\s*([kKmM])?/i);
  var gmv=gmvMatch?parseAmount(gmvMatch[1],gmvMatch[2]):null;

  // Items sold — bare integer with no $ prefix. Strip away both $X amounts AND "N days" phrases
  // (from "Last 7 days" toggle and "...past 7 days" banner text) so we don't grab "7" by mistake.
  // SAFETY: if no $ amounts appear anywhere in the OCR, Tesseract clearly failed to read the
  // values row (large display fonts on TTS Shop Home are hard for OCR). In that case, refuse to
  // extract a bogus items count from stray digits like "7" in "7 You gained...".
  var itemsSold=null;
  var ocrHasDollar=/\$\s*[\d,]+(?:\.\d+)?\s*[kKmM]?/.test(t);
  var itemsPos=t.search(/items?\s+sold/i);
  if(itemsPos>-1&&ocrHasDollar){
    var afterItems=t.substring(itemsPos);
    var stripped=afterItems
      .replace(/\$\s*[\d,]+(?:\.\d+)?\s*[kKmM]?/g,' ')
      .replace(/\b(?:last|past|next|in)\s+\d+\s+(?:days?|weeks?|months?|hours?)\b/gi,' ')
      .replace(/\b\d+\s*(?:days?|weeks?|months?|hours?|min|minutes?|sec|seconds?|am|pm)\b/gi,' ');
    var im=stripped.match(/items?\s+sold[\s\S]{0,120}?(?:^|[^\d.])([\d,]+)(?!\.\d)/i);
    if(im){var v=parseInt(im[1].replace(/,/g,''));if(!isNaN(v))itemsSold=v;}
  }

  // Commission — find "Est. commission(s)" with a $ within 100 chars (skips the banner mention),
  // then take the LAST $ amount in the value cluster after the label. The value cluster ends at
  // the next 5+ letter word (= a label like "Commission" or banner text).
  var commission=null;
  var estPos=-1,estLen=0;
  var estRe=/est(?:\.|imated)?\s+commissions?\b/gi;
  var em;
  while((em=estRe.exec(t))!==null){
    if(/\$/.test(t.substring(em.index,em.index+100))){estPos=em.index;estLen=em[0].length;break;}
  }
  if(estPos>-1){
    var afterEst=t.substring(estPos+estLen);
    // Cluster: everything up to the next 5+ letter word (excluding numbers / $ / %)
    var cluster=afterEst;
    var stopMatch=afterEst.match(/\b[A-Za-z]{5,}\b/);
    if(stopMatch)cluster=afterEst.substring(0,stopMatch.index);
    var dollarRe=/\$\s*([\d,]+(?:\.\d+)?)\s*([kKmM])?/g;
    var dollars=[];var dm;
    while((dm=dollarRe.exec(cluster))!==null)dollars.push(dm);
    if(dollars.length>0){
      var last=dollars[dollars.length-1];
      commission=parseAmount(last[1],last[2]);
    }
  }

  // Date detection
  var dateInfo={mode:null,date:null,startDate:null,endDate:null};
  var rangeMatch=t.match(/([a-z]+\s+\d+,?\s+\d{4})\s*[-–—]\s*([a-z]+\s+\d+,?\s+\d{4})/i);
  if(rangeMatch){
    var sd=new Date(rangeMatch[1]);var ed=new Date(rangeMatch[2]);
    if(!isNaN(sd.getTime())&&!isNaN(ed.getTime())){dateInfo.mode='range';dateInfo.startDate=sd.toISOString().slice(0,10);dateInfo.endDate=ed.toISOString().slice(0,10);}
  }
  if(!dateInfo.mode){
    var singleMatch=t.match(/([a-z]+\s+\d+,?\s+\d{4})\s*(?:\(GMT|$|\s)/i);
    if(singleMatch){var d=new Date(singleMatch[1]);if(!isNaN(d.getTime())){dateInfo.mode='single';dateInfo.date=d.toISOString().slice(0,10);}}
  }
  // Fallback: no specific date in OCR (e.g. Shop Home view) — default to "last 7 days" range
  // ending yesterday. User can switch to single in the confirm step.
  if(!dateInfo.mode){
    var yest=new Date();yest.setDate(yest.getDate()-1);
    var weekAgo=new Date(yest);weekAgo.setDate(yest.getDate()-6);
    dateInfo.mode='range';
    dateInfo.startDate=weekAgo.toISOString().slice(0,10);
    dateInfo.endDate=yest.toISOString().slice(0,10);
    dateInfo.defaulted=true;
  }
  return {gmv:gmv,itemsSold:itemsSold,commission:commission,dateInfo:dateInfo,rawText:text};
}

// Parse a TikTok Studio per-video analysis screenshot
function parseVideoScreenshot(text){
  var t=text.replace(/[\r\n]+/g,' ').replace(/\s+/g,' ');
  function num(re,asInt){var m=t.match(re);if(!m)return null;var v=String(m[1]||'').replace(/,/g,'');var n=asInt?parseInt(v):parseFloat(v);return isNaN(n)?null:n;}
  var views=num(/video\s+views[\s\S]{0,40}?([\d,]+)/i,true);
  // Lazy gap because OCR may put "Video views" and "Total play time" labels first, then their values second.
  var totalPlayTime=(t.match(/total\s+play\s+time[\s\S]{0,80}?(\d+h:\d+m:\d+s|\d+h:\d+m|\d+m:\d+s|\d+h|\d+m|\d{2,}s)/i)||[])[1]||null;
  var avgWatchTime=(t.match(/average\s+watch\s+time[\s\S]{0,80}?([\d.]+\s*[smh])/i)||[])[1]||null;
  // Require % so we don't grab the avg-watch-time number ("0.6s") by mistake.
  var watchFullPct=num(/watched\s+full\s+video[^%]{0,80}?([\d.]+)\s*%/i,false);
  var newFollowers=num(/new\s+followers?[^\d]{0,30}([\d,]+)/i,true);
  var commMatch=t.match(/est(?:\.|imated)?\s+rewards?[^$]{0,30}\$\s*([\d,]+(?:\.\d+)?)\s*([kKmM])?/i);
  var commission=commMatch?parseAmount(commMatch[1],commMatch[2]):null;
  // Posted date: "Posted on Feb 26, 2026, 8:16 PM"
  var postedMatch=t.match(/posted\s+on\s+([a-z]+\s+\d+,?\s+\d{4})/i);
  var postedDate=null;
  if(postedMatch){var pd=new Date(postedMatch[1]);if(!isNaN(pd.getTime()))postedDate=pd.toISOString().slice(0,10);}
  // Engagement row: TikTok Studio shows views/likes/comments/shares/saves as 5 numbers
  // right before the tab labels (Inspiration|Overview|Viewers|Engagement).
  // Tolerant approach: gather every number-token BEFORE that anchor, take the last 5.
  // [0] is the top-row views (often "88K") — we override with the labeled "Video views" value.
  // [1..4] are likes, comments, shares, saves.
  var likes=null,comments=null,shares=null,saves=null;
  var anchor=/(?:Inspiration|Overview|Viewers|Engagement)\b/i.exec(t);
  if(anchor){
    var beforeAnchor=t.substring(0,anchor.index);
    var tokens=beforeAnchor.match(/\d[\d,.]*\s*[KkMm]?/g)||[];
    // Drop tokens that are clearly part of the date ("2026", "26,", "16" from "8:16")
    // by filtering: a date year is 4 consecutive digits, day is 1-2 digits + comma. The
    // engagement-row tokens are usually trailing numbers after the date, so taking the
    // last 5 in OCR reading order is safe in practice.
    if(tokens.length>=5){
      var last5=tokens.slice(-5).map(function(s){return parseNumWithSuffix(s.trim());});
      likes=last5[1];comments=last5[2];shares=last5[3];saves=last5[4];
    }
  }
  return {views:views,likes:likes,comments:comments,shares:shares,saves:saves,totalPlayTime:totalPlayTime,avgWatchTime:avgWatchTime,watchFullPct:watchFullPct,newFollowers:newFollowers,commission:commission,postedDate:postedDate,rawText:text};
}

// Compatibility shim — older code may still call parseTtsText
function parseTtsText(text){return parseDailyScreenshot(text);}

function openTtsModal(charId){
  S.ttsModal={charId:charId,step:'pick',detectedType:null,mode:'single',date:todayStr(),startDate:'',endDate:todayStr(),imageDataUrl:null,processing:false,progress:'',extracted:null,error:null,videoMatchId:'new',videoTitle:''};
  document.getElementById('modal-wrap').style.display='flex';
  renderTtsModal();
}
function closeTtsModal(){S.ttsModal=null;document.getElementById('modal-wrap').style.display='none';}
function setTtsField(f,v){
  if(!S.ttsModal)return;
  S.ttsModal[f]=v;
  if(f==='mode'&&v==='range'&&!S.ttsModal.startDate){var end=todayStr();var sd=new Date();sd.setDate(sd.getDate()-6);S.ttsModal.startDate=sd.toISOString().slice(0,10);S.ttsModal.endDate=end;}
  renderTtsModal();
}
function setTtsImage(file){
  if(!file||!file.type||!file.type.startsWith('image/'))return;
  var reader=new FileReader();
  reader.onload=function(e){if(S.ttsModal){S.ttsModal.imageDataUrl=e.target.result;renderTtsModal();}};
  reader.readAsDataURL(file);
}
function processTtsImage(){
  if(!S.ttsModal||!S.ttsModal.imageDataUrl)return;
  S.ttsModal.processing=true;S.ttsModal.step='processing';S.ttsModal.error=null;S.ttsModal.progress='loading OCR engine…';
  renderTtsModal();
  ensureTesseract().then(function(T){
    S.ttsModal.progress='reading screenshot…';renderTtsModal();
    return T.recognize(S.ttsModal.imageDataUrl,'eng',{logger:function(m){if(m&&m.status==='recognizing text'&&S.ttsModal){S.ttsModal.progress='reading screenshot ('+Math.round((m.progress||0)*100)+'%)';}}});
  }).then(function(result){
    if(!S.ttsModal)return;
    var rawText=result.data.text;
    var type=detectScreenshotType(rawText);
    S.ttsModal.detectedType=type;
    if(type==='video'){
      S.ttsModal.extracted=parseVideoScreenshot(rawText);
      // Auto-suggest matching video by character + posted date
      var pd=S.ttsModal.extracted.postedDate;
      if(pd){
        var match=S.videos.find(function(v){return v.character===S.ttsModal.charId&&v.date===pd;});
        if(match){S.ttsModal.videoMatchId=match.id;S.ttsModal.videoTitle=match.title||'';}
      }
    } else if(type==='daily'){
      S.ttsModal.extracted=parseDailyScreenshot(rawText);
      // Apply detected dates / mode if found
      var di=S.ttsModal.extracted.dateInfo;
      if(di&&di.mode){
        S.ttsModal.mode=di.mode;
        if(di.mode==='single')S.ttsModal.date=di.date;
        else{S.ttsModal.startDate=di.startDate;S.ttsModal.endDate=di.endDate;}
      }
    } else {
      // Unknown — show daily form by default and let user fill manually
      S.ttsModal.detectedType='daily';
      S.ttsModal.extracted={gmv:null,itemsSold:null,commission:null,rawText:rawText,dateInfo:null};
    }
    S.ttsModal.step='confirm';S.ttsModal.processing=false;
    renderTtsModal();
  }).catch(function(e){
    if(!S.ttsModal)return;
    S.ttsModal.processing=false;S.ttsModal.step='pick';S.ttsModal.error=(e&&e.message)||'OCR failed';
    renderTtsModal();
  });
}
function saveTtsToLedger(force){

  function rdNum(id,asInt){var el=document.getElementById(id);if(!el||el.value===''||el.value==null)return null;var n=asInt?parseInt(el.value):Number(el.value);return isNaN(n)?null:n;}
  function rdStr(id){var el=document.getElementById(id);if(!el)return null;var v=String(el.value||'').trim();return v||null;}

  // VIDEO save path
  if(S.ttsModal.detectedType==='video'){
    var fields={
      views:rdNum('tts-v-views',true),
      likes:rdNum('tts-v-likes',true),
      comments:rdNum('tts-v-comments',true),
      shares:rdNum('tts-v-shares',true),
      saves:rdNum('tts-v-saves',true),
      revenue:rdNum('tts-v-rev',false),
      avgWatchTime:rdStr('tts-v-avg'),

    if(matchVal==='new'){

      var newV=Object.assign({id:Date.now(),character:charId,title:title,date:pdate,productLinks:[],background:'',imageCount:0,imageCredits:0,videoCount:1,videoCredits:0,posted:true,tags:[]},fields);

      showToast('created new video '+title,'green');
    } else {
      var vid=Number(matchVal);var v=S.videos.find(function(x){return x.id===vid;});
      if(!v){showToast('video not found','red');return;}
      var snap={};Object.keys(fields).forEach(function(k){snap[k]=v[k];});
      // Apply non-null fields only (preserve existing if OCR missed them and user didn't fill)
      Object.keys(fields).forEach(function(k){if(fields[k]!=null)v[k]=fields[k];});
      if(title&&title!==v.title)v.title=title;
      if(pdate&&pdate!==v.date)v.date=pdate;
      pushUndo(function(){Object.assign(v,snap);},function(){Object.keys(fields).forEach(function(k){if(fields[k]!=null)v[k]=fields[k];});},'video screenshot → '+(v.title||v.id));
      logH('import','video screenshot → '+(v.title||v.id));
      showToast('updated '+(v.title||'video'),'green');
    }
    save();closeTtsModal();render();return;
  }

  // DAILY save path
  var gmv=rdNum('tts-gmv',false),items=rdNum('tts-items',true),commission=rdNum('tts-comm',false);
  if(gmv==null&&items==null&&commission==null){showToast('nothing to save — fill at least one field','red');return;}
  // Warn if any field is blank — most common cause is uploading the wrong tab (e.g. Overview without commission).
  if(!force){
    var missing=[];
    if(gmv==null)missing.push('GMV');
    if(items==null)missing.push('items sold');
    if(commission==null)missing.push('commission');
    if(missing.length>0){
      var hint=missing.indexOf('commission')>-1?'<br><br>You may have uploaded an <strong>Overview</strong> dashboard screenshot — that tab doesn\'t show commission. The <strong>Commissions</strong> tab has the Est. commission field. Upload that one, or type the missing value(s) manually.':'<br><br>Type the missing value(s) manually if you have them.';
      showConf(missing.length+' empty field'+(missing.length>1?'s':''),'These are blank: <strong>'+missing.join(', ')+'</strong>.'+hint+'<br><br>Save anyway with what we have?',function(){saveTtsToLedger(true);},'save anyway','#BA7517');
      return;
    }
  }
  if(S.ttsModal.mode==='single'){
    var date=S.ttsModal.date;
    var existing=getDailyEntry(charId,date);var hadBefore=!!existing;
    var prevSnap=existing?{gmv:existing.gmv,itemsSold:existing.itemsSold,commission:existing.commission}:null;
    var patch={};if(gmv!=null)patch.gmv=gmv;if(items!=null)patch.itemsSold=items;if(commission!=null)patch.commission=commission;
    upsertDailyEntry(charId,date,patch);
    pushUndo(function(){if(!hadBefore){S.dailyLedger=S.dailyLedger.filter(function(e){return !(e.character===charId&&e.date===date);});}else{var e=getDailyEntry(charId,date);if(e&&prevSnap)Object.assign(e,prevSnap);}},function(){upsertDailyEntry(charId,date,patch);},'TTS import: '+date);
    logH('import','TTS screenshot → '+date+' for '+charId);
    showToast('saved to '+date,'green');
  }else{
    // Range mode: save ONE aggregate entry covering the date range. Don't fake daily granularity.
    var sd=S.ttsModal.startDate,ed=S.ttsModal.endDate;
    if(!sd||!ed||sd>ed){showToast('invalid date range','red');return;}
    var dayCount=Math.round((new Date(ed)-new Date(sd))/86400000)+1;
    var existing=S.dailyLedger.find(function(e){return e.character===charId&&e.rangeStart===sd&&(e.rangeEnd||e.date)===ed;});
    if(existing){
      var prev={gmv:existing.gmv,itemsSold:existing.itemsSold,commission:existing.commission};
      if(gmv!=null)existing.gmv=gmv;if(items!=null)existing.itemsSold=items;if(commission!=null)existing.commission=commission;
      pushUndo(function(){Object.assign(existing,prev);},function(){if(gmv!=null)existing.gmv=gmv;if(items!=null)existing.itemsSold=items;if(commission!=null)existing.commission=commission;},'TTS range update: '+sd+' to '+ed);
      showToast('updated '+dayCount+'-day range','green');
    }else{
      var entry={id:Date.now()+Math.floor(Math.random()*9999),character:charId,date:ed,rangeStart:sd,rangeEnd:ed,startBalance:null,endBalance:null,gmv:gmv,itemsSold:items,commission:commission,note:''};
      S.dailyLedger.push(entry);
      pushUndo(function(){S.dailyLedger=S.dailyLedger.filter(function(e){return e.id!==entry.id;});},function(){S.dailyLedger.push(entry);},'TTS range import: '+sd+' to '+ed);
      showToast(dayCount+'-day range saved as one entry','green');
    }
    logH('import','TTS range → '+sd+' to '+ed+' ('+dayCount+' days) for '+charId);
  }
  save();closeTtsModal();render();
}

function setGenChar(id){var was=S.gen.character;S.gen.character=was===id?null:id;if(S.gen.character!==was)S.gen.background=null;save();render();}
function setGenBg(id){S.gen.background=S.gen.background===id?null:id;save();render();}

function setGenCustomPrompt(val){
  S.gen.customPrompt=val;
  // Live-update the preview without full render so focus + cursor stay put.
  var pb=document.getElementById('prompt-preview-text');
  if(pb){
    var newText=assemblePrompt();
    var anyNow=newText.length>0;
    pb.textContent=anyNow?newText:'pick a character to start →';
  }
  save();

function assemblePrompt(){
  var g=S.gen;var parts=[];
  // Image-reference mode: when a model image is selected, use @image1, @image2, ... refs
  // and rely on actual images sent to Higgsfield in order: [modelImage, ...products].
  if(g.modelImage){
    parts.push('@image1');
    if(g.products.length){
      var refs=g.products.map(function(_,i){return '@image'+(i+2);}).join(', ');
      parts.push('wearing '+refs);
    }
    if(g.background){var b1=S.backgrounds.find(function(x){return x.id===g.background;});if(b1)parts.push('in '+b1.name);}
    if(g.angle){var a1=S.angles.find(function(x){return x.id===g.angle;});if(a1)parts.push(a1.promptSnippet||a1.name);}
    if(g.motion){var m1=S.motions.find(function(x){return x.id===g.motion;});if(m1)parts.push(m1.promptSnippet||m1.name);}
  } else {
    // Text-only fallback (no model image): keep legacy behaviour
    if(g.character){var c=gc(g.character);parts.push(c.description?c.description:c.name);}
    if(g.products.length){
      var names=g.products.map(function(pid){var p=S.products.find(function(x){return x.id===pid;});return p?p.name:'';}).filter(Boolean);
      if(names.length)parts.push('wearing '+names.join(', '));
    }
    if(g.background){var b=S.backgrounds.find(function(x){return x.id===g.background;});if(b)parts.push('in '+b.name);}
    if(g.angle){var a=S.angles.find(function(x){return x.id===g.angle;});if(a)parts.push(a.promptSnippet||a.name);}
    if(g.motion){var m=S.motions.find(function(x){return x.id===g.motion;});if(m)parts.push(m.promptSnippet||m.name);}
  }
  var assembled=parts.join('. ').replace(/\.+\s*\./g,'.').trim()+(parts.length?'.':'');
  var custom=(g.customPrompt||'').trim();
  if(custom)return (assembled?assembled+' ':'')+custom;
  return assembled;
}

function copyPrompt(){var p=assemblePrompt();if(!p){showToast('nothing to copy yet — pick something','muted');return;}var ta=document.createElement('textarea');ta.value=p;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('prompt copied','green');}catch(e){showToast('copy failed','red');}document.body.removeChild(ta);}

// === Higgsfield video generation (via aiops-proxy) ===
// Module-level scratch state (not persisted to localStorage — re-render with render()).
var activeGenState=null;
function clearActiveGen(){activeGenState=null;render();}
function cancelActiveGen(){
  if(!activeGenState)return;
  var id=activeGenState.id,st=activeGenState.status;
  if(id&&st!=='completed'&&st!=='error'&&st!=='timeout'){
    var secret=localStorage.getItem('aicops_proxy_secret');
    if(secret){fetch(PROXY_BASE+'/generations/'+encodeURIComponent(id),{method:'DELETE',headers:{'Authorization':'Bearer '+secret}}).catch(function(){});}
  }
  activeGenState={status:'cancelled',statusText:'cancelled',cancelled:true};
  render();
  setTimeout(clearActiveGen,1500);
}
// Resize/recompress a base64 data URL to fit Vercel's 4.5MB request-body cap.
// Max longest side = maxDim, JPEG quality = quality (0..1). Always re-encodes
// to JPEG so consistent compression is applied regardless of source format.
function compressImageForUpload(dataUrl,maxDim,quality){
  return new Promise(function(resolve,reject){
    if(!dataUrl){return reject(new Error('empty image data'));}
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>=h){h=Math.round(h*(maxDim/w));w=maxDim;}
        else    {w=Math.round(w*(maxDim/h));h=maxDim;}
      }
      var canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      try{resolve(canvas.toDataURL('image/jpeg',quality));}
      catch(e){reject(e);}
    };
    img.onerror=function(){reject(new Error('image failed to load (corrupt or non-image data?)'));};
    img.src=dataUrl;
  });
}

async function generateVideo(){
  var prompt=assemblePrompt();
  if(!prompt){showToast('pick something first','muted');return;}
  if(activeGenState&&['submitting','queued','processing','pending','Queued','InProgress'].indexOf(activeGenState.status)>-1){showToast('already generating — cancel first','muted');return;}
  var secret=getProxySecret();
  if(!secret){showToast('proxy secret needed','red');return;}
  activeGenState={status:'submitting',statusText:'submitting…',startedAt:Date.now()};
  render();
  // Build images array if a model image is selected: [modelImage, ...products] in order.
  // Sent to Higgsfield as @image1, @image2, @image3... in the assembled prompt.
  // Field name 'images' is the v0 guess — adjust here if Higgsfield rejects (see GEN_DEFAULTS comment).
  var images=[];
  if(S.gen.modelImage){
    var miSel=S.modelImages.find(function(x){return x.id===S.gen.modelImage;});
    if(miSel&&miSel.imageData)images.push(miSel.imageData);
  }
  if(S.gen.products&&S.gen.products.length){
    S.gen.products.forEach(function(pid){
      var p=S.products.find(function(x){return x.id===pid;});
      if(p&&p.imageData)images.push(p.imageData);
    });
  }
  // Compress images before sending — Vercel Hobby has a 4.5MB request-body cap,
  // and uncompressed base64 from full-resolution photos blows past that fast.
  // Resize to max 1024px on the longest side and re-encode as JPEG @ 0.8 quality.
  if(images.length>0){
    activeGenState.statusText='compressing '+images.length+' image'+(images.length>1?'s':'')+'…';
    render();
    try{
      images=await Promise.all(images.map(function(d){return compressImageForUpload(d,1024,0.8);}));
    }catch(err){
      activeGenState={status:'error',statusText:'image compression failed: '+err.message,error:err.message,startedAt:activeGenState.startedAt};
      render();
      showToast('image compression failed','red');
      return;
    }
  }
  var body;
  if(images.length>0){
    // Image-conditioned mode — switch task and pass images in order
    body=Object.assign({},GEN_DEFAULTS,{task:'image-to-video',prompt:prompt,images:images});
  }else{
    body=Object.assign({},GEN_DEFAULTS,{prompt:prompt});
  }
  try{
    var submitRes=await fetch(PROXY_BASE+'/generations',{method:'POST',headers:{'Authorization':'Bearer '+secret,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!submitRes.ok){
      var errText=await submitRes.text();
      if(submitRes.status===401){clearProxySecret();throw new Error('unauthorized — proxy secret rejected. cleared, click generate again to re-enter.');}
      throw new Error('submit failed ('+submitRes.status+'): '+errText.slice(0,240));
    }
    var sd=await submitRes.json();
    // Higgsfield returns the job id as 'request_id' (verified from SDK source).
    // Falling back to 'id' for backward compat with the old proxy/api shape.
    var jobId=sd.request_id||sd.id;
    if(!jobId){throw new Error('no job id returned. response: '+JSON.stringify(sd).slice(0,240));}
    activeGenState.id=jobId;
    activeGenState.status='queued';
    activeGenState.statusText='queued · id '+String(jobId).slice(0,18);
    render();
    await pollGen(secret);
  }catch(err){
    if(activeGenState&&activeGenState.cancelled)return;
    activeGenState={status:'error',statusText:'failed: '+err.message,error:err.message,startedAt:activeGenState?activeGenState.startedAt:Date.now()};
    render();
    showToast('generation failed','red');
  }
}
async function pollGen(secret){
  var TERM_OK=['completed','Completed'];
  var TERM_FAIL=['failed','Failed','NSFW','nsfw','Cancelled','cancelled'];
  var MAX_ATTEMPTS=120; // ~6 min @ 3s
  for(var i=0;i<MAX_ATTEMPTS;i++){
    await new Promise(function(r){setTimeout(r,3000);});
    if(!activeGenState||activeGenState.cancelled)return;
    try{
      var r=await fetch(PROXY_BASE+'/generations/'+encodeURIComponent(activeGenState.id),{headers:{'Authorization':'Bearer '+secret}});
      if(!r.ok){continue;} // transient — retry
      var d=await r.json();
      var elapsed=Math.round((Date.now()-activeGenState.startedAt)/1000);
      activeGenState.status=d.status||'unknown';
      activeGenState.statusText=String(d.status||'unknown')+' · '+elapsed+'s';
      if(TERM_OK.indexOf(d.status)>-1){
        var output=d.output||(d.video&&d.video.url)||(d.images&&d.images[0]&&d.images[0].url);
        activeGenState.status='completed';
        activeGenState.output=output;
        activeGenState.statusText='done · '+elapsed+'s';
        render();
        showToast('video ready','green');
        return;
      }
      if(TERM_FAIL.indexOf(d.status)>-1){
        // Surface every field Higgsfield returned so we can see what actually failed
        // (image format, content moderation, invalid arg, etc).
        console.error('Higgsfield status response on failure:',d);
        var detail=d.error||d.error_message||d.failure_reason||d.detail||d.message||'';
        var dump=JSON.stringify(d).slice(0,400);
        throw new Error('upstream returned status: '+d.status+(detail?' — '+detail:'')+' · raw: '+dump);
      }
      render();
    }catch(err){
      activeGenState={status:'error',statusText:'failed: '+err.message,error:err.message,startedAt:activeGenState.startedAt};
      render();
      showToast('generation failed','red');
      return;
    }
  }
  activeGenState.status='timeout';
  activeGenState.statusText='timed out after 6 min — check proxy logs';
  render();
}

function startSaveBlueprint(){S.savingBlueprint=defaultBlueprintName();render();setTimeout(function(){var i=document.getElementById('bp-name-input');if(i){i.focus();i.select();}},0);}

function confirmSaveBlueprint(){
  var i=document.getElementById('bp-name-input');var name=(i?i.value:S.savingBlueprint||'').trim();if(!name){showToast('enter a name','red');return;}
  var g=S.gen;

function loadBlueprint(id){
  var bp=S.blueprints.find(function(x){return x.id===id;});if(!bp)return;
  // Defensively check items still exist; null any orphans
  var charOk=bp.character&&S.characters.some(function(c){return c.id===bp.character;});
  var miOk=bp.modelImage&&S.modelImages.some(function(m){return m.id===bp.modelImage;});
  var bgOk=bp.background&&S.backgrounds.some(function(b){return b.id===bp.background;});
  var motOk=bp.motion&&S.motions.some(function(m){return m.id===bp.motion;});
  var angOk=bp.angle&&S.angles.some(function(a){return a.id===bp.angle;});
  var validProds=(bp.products||[]).filter(function(pid){return S.products.some(function(p){return p.id===pid;});});
  S.gen={character:charOk?bp.character:null,modelImage:miOk?bp.modelImage:null,background:bgOk?bp.background:null,motion:motOk?bp.motion:null,angle:angOk?bp.angle:null,products:validProds,customPrompt:typeof bp.customPrompt==='string'?bp.customPrompt:''};
  var dropped=(bp.character&&!charOk)||(bp.modelImage&&!miOk)||(bp.background&&!bgOk)||(bp.motion&&!motOk)||(bp.angle&&!angOk)||(bp.products||[]).length!==validProds.length;
  save();render();showToast('loaded: '+bp.name+(dropped?' (some items deleted)':''),'green');
}
function deleteBlueprint(id){
  var idx=S.blueprints.findIndex(function(x){return x.id===id;});if(idx<0)return;
  var snap=S.blueprints[idx];S.blueprints.splice(idx,1);
  pushUndo(function(){S.blueprints.splice(idx,0,snap);},function(){S.blueprints=S.blueprints.filter(function(x){return x.id!==snap.id;});},'deleted blueprint: '+snap.name);
  logH('delete','deleted blueprint: '+snap.name);save();render();showToast('blueprint deleted','muted');
}

// === Earnings tab ===
function setEarnRange(r){S.earnRange=r;render();}
function setEarnMetric(m){S.earnMetric=m;render();}
function earnRangeDates(range){
  var t=new Date();var dates=[];
  if(range==='thisMonth'){
    var first=new Date(t.getFullYear(),t.getMonth(),1);
    var cur=new Date(first);
    while(cur<=t){dates.push(cur.toISOString().slice(0,10));cur.setDate(cur.getDate()+1);}
  } else if(range==='lastMonth'){
    var lmStart=new Date(t.getFullYear(),t.getMonth()-1,1);
    var lmEnd=new Date(t.getFullYear(),t.getMonth(),0);
    var c=new Date(lmStart);
    while(c<=lmEnd){dates.push(c.toISOString().slice(0,10));c.setDate(c.getDate()+1);}
  } else if(range==='last30'){
    for(var i=29;i>=0;i--){var d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-i);dates.push(d.toISOString().slice(0,10));}
  } else { // allTime
    // Pull from existing data
    var all=[];
    S.dailyLedger.forEach(function(e){all.push(e.date);});
    S.videos.forEach(function(v){if(v.date)all.push(v.date);});
    if(!all.length)return [t.toISOString().slice(0,10)];
    all.sort();
    var start=new Date(all[0]);var end=new Date(all[all.length-1]);
    var c2=new Date(start);
    while(c2<=end){dates.push(c2.toISOString().slice(0,10));c2.setDate(c2.getDate()+1);}
  }
  return dates;
}
function earnSeriesForChar(charId,dates,metric){
  return dates.map(function(d){
    if(metric==='gmv')return getEffectiveDaily(charId,d).gmv;
    if(metric==='commission')return getEffectiveDaily(charId,d).commission;
    if(metric==='videos'){return S.videos.filter(function(v){return v.character===charId&&v.date===d&&v.posted===true;}).length;}
    return 0;
  });
}
function earnTotalForChar(charId,dates,metric){return earnSeriesForChar(charId,dates,metric).reduce(function(a,b){return a+b;},0);}

function renderEarningsChart(chars,dates,metric){
  if(!chars.length||!dates.length)return '';
  var series=chars.map(function(c){return {label:c.name,color:c.color,data:earnSeriesForChar(c.id,dates,metric)};});
  var allVals=[].concat.apply([],series.map(function(s){return s.data;}));
  var maxVal=Math.max.apply(null,allVals);
  if(maxVal<=0)return '<div class="muted" style="text-align:center;padding:40px;font-size:13px">no '+metric+' data in this range</div>';
  var yMax=Math.ceil(maxVal*1.15);if(yMax<5)yMax=5;
  var W=720,H=220,padL=46,padR=12,padT=16,padB=24;
  function xC(i){return dates.length===1?(padL+(W-padL-padR)/2):padL+(i/(dates.length-1))*(W-padL-padR);}
  function yC(v){return H-padB-(v/yMax)*(H-padT-padB);}
  var paths=series.map(function(s){if(!s.data.some(function(v){return v>0;}))return '';var d=s.data.map(function(v,i){return (i===0?'M':'L')+xC(i).toFixed(1)+','+yC(v).toFixed(1);}).join(' ');return '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>';}).join('');
  var prefix=metric==='videos'?'':'$';
  var yTicks=[0,Math.round(yMax/2),yMax];
  var yLabels=yTicks.map(function(v){return '<g><line x1="'+padL+'" y1="'+yC(v).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yC(v).toFixed(1)+'" stroke="var(--row-div)" stroke-width="0.5" stroke-dasharray="2,3"/><text x="'+(padL-6)+'" y="'+(yC(v)+3.5)+'" fill="var(--text2)" font-size="9.5" text-anchor="end" font-family="system-ui">'+prefix+v+'</text></g>';}).join('');
  var xLabels='';var step=Math.max(1,Math.floor(dates.length/6));for(var i=0;i<dates.length;i+=step){xLabels+='<text x="'+xC(i).toFixed(1)+'" y="'+(H-padB+13)+'" fill="var(--text2)" font-size="9.5" text-anchor="middle" font-family="system-ui">'+dates[i].slice(5)+'</text>';}
  var dots=series.map(function(s){var li=s.data.length-1;var lv=s.data[li];if(!lv)return '';return '<circle cx="'+xC(li).toFixed(1)+'" cy="'+yC(lv).toFixed(1)+'" r="3.5" fill="'+s.color+'"/>';}).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;max-height:260px">'+yLabels+xLabels+paths+dots+'</svg>';
}

function renderEarnings(){
  var chars=activeChars();
  if(!chars.length)return '<div class="muted" style="text-align:center;padding:40px">no active characters</div>';
  var range=S.earnRange||'thisMonth';
  var metric=S.earnMetric||'commission';
  var dates=earnRangeDates(range);

  var metricRow='<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px"><span class="muted" style="font-size:11px;margin-right:4px">metric:</span>'+metricPill('gmv','GMV')+metricPill('commission','commission')+metricPill('videos','videos posted')+'</div>';
  var legend=chars.map(function(c){var t=earnTotalForChar(c.id,dates,metric);var disp=metric==='videos'?String(t):fmtUSD(t);return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text);margin-right:14px">'+dot(c.color,7)+c.name+' <span class="muted" style="margin-left:3px">('+disp+')</span></span>';}).join('');
  var chartCard='<div class="card" style="border:0.5px solid;border-radius:12px;padding:14px 18px;margin-bottom:14px"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px"><div><div class="sl">'+(metric==='videos'?'videos posted':metric)+' — '+rangeLabel+'</div><div class="muted" style="font-size:10px;margin-top:2px">per character over '+dates.length+' day'+(dates.length>1?'s':'')+'</div></div><div style="display:flex;flex-wrap:wrap;gap:0">'+legend+'</div></div>'+renderEarningsChart(chars,dates,metric)+'</div>';

  // Per-character cards with all 3 metrics for the selected range
  var cards=chars.map(function(c){
    var gmv=earnTotalForChar(c.id,dates,'gmv');
    var comm=earnTotalForChar(c.id,dates,'commission');
    var vids=earnTotalForChar(c.id,dates,'videos');
    var cs=charStats(c.id);// for ROI we use lifetime total credits since per-range credit usage isn't tracked separately
    var rangeCreditTotal=S.videos.filter(function(v){return v.character===c.id&&dates.indexOf(v.date)>-1;}).reduce(function(a,v){return a+tc(v);},0);
    var roiVal=roi(comm,rangeCreditTotal);
    var stat=function(lbl,val,sub){return '<div style="flex:1;min-width:0"><div class="sl" style="margin-bottom:2px">'+lbl+'</div><div style="font-size:18px;font-weight:500;color:var(--text);letter-spacing:-0.3px">'+val+'</div>'+(sub?'<div class="muted" style="font-size:11px;margin-top:1px">'+sub+'</div>':'')+'</div>';};
    return '<div class="card" style="border:0.5px solid;border-radius:12px;padding:14px 18px;margin-bottom:10px;border-left:3px solid '+c.color+'"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'+dot(c.color,9)+'<span style="font-size:14px;font-weight:500;color:var(--text)">'+c.name+'</span></div><div style="display:flex;gap:14px;flex-wrap:wrap">'+stat('GMV',fmtUSD(gmv),vids?'over '+vids+' posted vid'+(vids>1?'s':''):null)+stat('commission',fmtUSD(comm),null)+stat('videos posted',String(vids),null)+stat('ROI',fmtROI(roiVal),roiVal!=null?(roiVal>=1?'profitable':'underwater'):null)+'</div></div>';
  }).join('');

  return rangeRow+metricRow+chartCard+'<div class="sl" style="margin-bottom:8px">per character — '+rangeLabel+'</div>'+cards;

// Token lives in sessionStorage so it dies with the tab; we never persist
// OAuth tokens to localStorage.

function gmailGetToken(){return sessionStorage.getItem('aicops_gmail_token')||null;}
function gmailSetToken(t){if(t)sessionStorage.setItem('aicops_gmail_token',t);else sessionStorage.removeItem('aicops_gmail_token');}

function gmailEnsureTokenClient(){
  if(gmailTokenClient)return gmailTokenClient;
  if(!window.google||!google.accounts||!google.accounts.oauth2){
    showToast('Google Identity script not loaded yet — refresh and try again','red');
    return null;
  }
  if(GOOGLE_CLIENT_ID.indexOf('PASTE_YOUR_GOOGLE_CLIENT_ID_HERE')>-1){
    showToast('Google Client ID not set in dashboard.html — paste your OAuth client ID','red');
    return null;
  }
  gmailTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:GMAIL_SCOPES,
    callback:function(resp){
      if(resp.error){showToast('Gmail auth failed: '+resp.error,'red');return;}
      gmailSetToken(resp.access_token);
      gmailFetchUserEmail().then(function(){loadEmails();}).catch(function(e){console.error(e);});
    },
  });
  return gmailTokenClient;
}

function gmailConnect(){
  var c=gmailEnsureTokenClient();if(!c)return;
  c.requestAccessToken({prompt:S.gmailEmail?'':'consent'});
}

function gmailDisconnect(){
  var t=gmailGetToken();
  if(t&&window.google&&google.accounts&&google.accounts.oauth2){
    try{google.accounts.oauth2.revoke(t,function(){});}catch(e){}
  }
  gmailSetToken(null);
  S.gmailEmail=null;S.emails=[];S.activeEmailId=null;S.composingReply=null;
  save();render();
  showToast('disconnected from Gmail','muted');
}

async function gmailApi(path,opts){
  opts=opts||{};
  var token=gmailGetToken();
  if(!token)throw new Error('not connected to Gmail');
  var r=await fetch('https://gmail.googleapis.com/gmail/v1/'+path,Object.assign({},opts,{
    headers:Object.assign({'Authorization':'Bearer '+token},opts.headers||{}),
  }));
  if(r.status===401){
    gmailSetToken(null);
    throw new Error('Gmail token expired — click connect again');
  }
  if(!r.ok){
    var t=await r.text();
    throw new Error('Gmail '+r.status+': '+t.slice(0,200));
  }
  return r.json();
}

async function gmailFetchUserEmail(){
  var r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{'Authorization':'Bearer '+gmailGetToken()}});
  if(r.ok){var d=await r.json();S.gmailEmail=d.email||null;save();render();}
}

// Recursively walk message payload to find a text/plain or text/html body
function gmailExtractBody(payload){
  if(!payload)return '';
  function decode(b){if(!b)return '';try{return atob(b.replace(/-/g,'+').replace(/_/g,'/'));}catch(e){return '';}}
  if(payload.body&&payload.body.data&&(!payload.parts||!payload.parts.length)){
    return decode(payload.body.data);
  }
  if(payload.parts&&payload.parts.length){
    // Prefer text/plain over text/html
    for(var i=0;i<payload.parts.length;i++){
      var p=payload.parts[i];
      if(p.mimeType==='text/plain'&&p.body&&p.body.data)return decode(p.body.data);
    }
    for(var j=0;j<payload.parts.length;j++){
      var p2=payload.parts[j];
      if(p2.mimeType==='text/html'&&p2.body&&p2.body.data){
        return decode(p2.body.data).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      }
    }
    // Recurse into multipart
    for(var k=0;k<payload.parts.length;k++){
      var nested=gmailExtractBody(payload.parts[k]);
      if(nested)return nested;
    }
  }
  return '';
}

function gmailHeader(msg,name){
  var h=msg.payload&&msg.payload.headers;
  if(!h)return '';
  for(var i=0;i<h.length;i++){if(h[i].name.toLowerCase()===name.toLowerCase())return h[i].value;}
  return '';
}

async function loadEmails(){
  if(!gmailGetToken()){showToast('connect Gmail first','muted');return;}
  S.emailListLoading=true;render();
  try{
    var list=await gmailApi('users/me/messages?maxResults=20&q=in:inbox -in:chats');
    var ids=(list.messages||[]).map(function(m){return m.id;});
    var existing={};(S.emails||[]).forEach(function(e){existing[e.id]=e;});
    var fetched=[];
    for(var i=0;i<ids.length;i++){
      var id=ids[i];
      if(existing[id]){fetched.push(existing[id]);continue;} // already cached
      var msg=await gmailApi('users/me/messages/'+id+'?format=full');
      fetched.push({
        id:id,
        threadId:msg.threadId,
        subject:gmailHeader(msg,'Subject'),
        from:gmailHeader(msg,'From'),
        date:gmailHeader(msg,'Date'),
        snippet:msg.snippet||'',
        body:gmailExtractBody(msg.payload).slice(0,12000),
        category:null,summary:null,suggestedReplies:null,
      });
    }
    S.emails=fetched;S.emailListLoading=false;
    save();render();
    showToast('loaded '+fetched.length+' email'+(fetched.length===1?'':'s'),'green');
  }catch(err){
    S.emailListLoading=false;render();
    showToast('load failed: '+err.message,'red');
  }
}

// Build an RFC822 message and base64url-encode for Gmail API send
function buildRfc822(toAddr,fromAddr,subject,inReplyTo,bodyText){
  var headers=[
    'From: '+fromAddr,
    'To: '+toAddr,
    'Subject: '+subject,
    'MIME-Version: 1.0',
    'Content-Type: text/plain; charset=utf-8',
  ];
  if(inReplyTo){headers.push('In-Reply-To: '+inReplyTo);headers.push('References: '+inReplyTo);}
  var msg=headers.join('\r\n')+'\r\n\r\n'+bodyText;
  // base64url encode (UTF-8 safe)
  var utf8=unescape(encodeURIComponent(msg));
  return btoa(utf8).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function sendReply(emailId,replyBody){
  var em=S.emails.find(function(x){return x.id===emailId;});if(!em){showToast('email not found','red');return;}
  if(!gmailGetToken()){showToast('connect Gmail first','muted');return;}
  if(!replyBody||!replyBody.trim()){showToast('reply body is empty','muted');return;}
  // Pull required headers from the original email
  var toAddr=em.from; // reply goes back to the sender
  var subj=em.subject||'';
  var subject=subj.toLowerCase().indexOf('re:')===0?subj:'Re: '+subj;
  // Try to fetch Message-ID for proper threading; fallback to no In-Reply-To
  var inReplyTo='';
  try{var msg=await gmailApi('users/me/messages/'+emailId+'?format=metadata&metadataHeaders=Message-ID');inReplyTo=gmailHeader(msg,'Message-ID')||'';}catch(e){}
  var raw=buildRfc822(toAddr,S.gmailEmail||'me',subject,inReplyTo,replyBody);
  try{
    em.sending=true;render();
    await gmailApi('users/me/messages/send',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({raw:raw,threadId:em.threadId}),
    });
    em.sending=false;
    em.sentAt=new Date().toISOString();
    em.sentBody=replyBody;
    S.composingReply=null;
    save();render();
    showToast('reply sent','green');
  }catch(err){
    em.sending=false;render();
    showToast('send failed: '+err.message,'red');
  }
}
