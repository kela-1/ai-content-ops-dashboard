    var hasAddr=(c.mailingAddress||'').trim().length>0;
    return '<div style="border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;background:var(--card-bg)"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+dot(c.color,8)+'<div style="font-size:12px;font-weight:500;color:var(--text)">'+c.name+' — mailing address</div>'+(hasAddr?'<span style="font-size:10px;color:#1D9E75;margin-left:auto">✓ set</span>':'<span style="font-size:10px;color:var(--text2);margin-left:auto">not set</span>')+'</div><textarea id="ma-'+c.id+'" class="inp" rows="2" placeholder="Name, Street, City, State ZIP" style="resize:vertical;line-height:1.4;font-family:monospace;font-size:11.5px" onchange="setMailingAddress(\''+c.id+'\',this.value)">'+(c.mailingAddress||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</textarea></div>';
  }).join('');
  var addrCard='<div class="card" style="border:0.5px solid;border-radius:12px;padding:14px 18px;margin-bottom:14px"><div class="sl" style="margin-bottom:8px">mailing addresses</div><div class="muted" style="font-size:10px;margin-bottom:10px">used in free-sample auto-replies. one per character.</div>'+addrBlocks+'</div>';

  // Email list
  var emails=S.emails||[];
  if(!emails.length){
    var empty='<div class="card" style="border:0.5px solid;border-radius:12px;padding:24px;text-align:center"><div class="muted" style="font-size:13px">'+(S.emailListLoading?'loading inbox…':'no emails loaded yet — click refresh')+'</div></div>';
    return header+addrCard+empty;
  }

  var listItems=emails.map(function(em){
    var isActive=S.activeEmailId===em.id;
    var catPill='';
    if(em.category==='trash')catPill='<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:#e24b4a22;color:#e24b4a;border:0.5px solid #e24b4a44">trash</span>';
    else if(em.category==='free_sample')catPill='<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:#1D9E7522;color:#1D9E75;border:0.5px solid #1D9E7544">free sample</span>';
    else if(em.category==='brand_deal')catPill='<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:#7F77DD22;color:#7F77DD;border:0.5px solid #7F77DD44">brand deal</span>';
    else if(em.categorizing)catPill='<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:var(--tag-bg);color:var(--text2);border:0.5px solid var(--tag-border)">categorizing…</span>';
    var border=isActive?'1.5px solid #7F77DD':'0.5px solid var(--border)';
    var bg=isActive?'#7F77DD0e':'var(--card-bg)';
    var sentMark=em.sentAt?'<span style="font-size:10px;color:#1D9E75;margin-left:6px">↩ replied</span>':'';
    return '<div onclick="setActiveEmail(\''+em.id+'\')" style="border:'+border+';background:'+bg+';border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px"><div style="font-size:12.5px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+(em.subject||'(no subject)').replace(/</g,'&lt;')+sentMark+'</div>'+catPill+'</div><div class="muted" style="font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(em.from||'').replace(/</g,'&lt;')+'</div></div>';
  }).join('');
  var listCard='<div class="card" style="border:0.5px solid;border-radius:12px;padding:14px 16px;margin-bottom:14px"><div class="sl" style="margin-bottom:10px">recent ('+emails.length+')</div>'+listItems+'</div>';

  // Detail view
  var detail='';
  if(S.activeEmailId){
    var em=emails.find(function(x){return x.id===S.activeEmailId;});
    if(em){
      var headBlock='<div style="border-bottom:0.5px solid var(--row-div);padding-bottom:10px;margin-bottom:12px"><div style="font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px">'+(em.subject||'(no subject)').replace(/</g,'&lt;')+'</div><div class="muted" style="font-size:11px">'+(em.from||'').replace(/</g,'&lt;')+'</div>'+(em.date?'<div class="muted" style="font-size:10.5px;margin-top:2px">'+em.date.replace(/</g,'&lt;')+'</div>':'')+'</div>';
      var bodyBlock='<div style="background:var(--inp-bg);border:0.5px solid var(--border);border-radius:8px;padding:12px;font-size:12px;line-height:1.55;max-height:240px;overflow:auto;white-space:pre-wrap;color:var(--text);margin-bottom:12px">'+(em.body||em.snippet||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';

      var actionBlock;
      if(em.categorizing){
        actionBlock='<div class="muted" style="font-size:12px;padding:10px 0">categorizing with claude…</div>';
      }else if(!em.category){
        actionBlock='<button onclick="categorizeEmail(\''+em.id+'\')" class="btn-primary" style="padding:8px 16px;font-size:12px;border-radius:8px">categorize + draft replies</button>'+(em.categorizeError?'<div style="font-size:11px;color:#e24b4a;margin-top:6px">'+em.categorizeError.replace(/</g,'&lt;')+'</div>':'');
      }else{
        // Show summary + replies
        var summBlock='<div style="margin-bottom:14px"><div class="sl" style="margin-bottom:4px">summary</div><div style="font-size:13px;color:var(--text);line-height:1.5">'+(em.summary||'').replace(/</g,'&lt;')+'</div></div>';
        var replyButtons='';
        if(em.suggestedReplies&&em.suggestedReplies.length){
          replyButtons=em.suggestedReplies.map(function(r,i){
            var clr=r.label==='Accept'?'#1D9E75':r.label==='Decline'?'#e24b4a':r.label==='Negotiate'?'#BA7517':'#7F77DD';
            return '<button onclick="startReply(\''+em.id+'\','+i+')" style="padding:7px 14px;font-size:12px;border-radius:8px;border:0.5px solid '+clr+'66;color:'+clr+';background:'+clr+'14;cursor:pointer;font-family:inherit;margin-right:6px;margin-bottom:6px">'+r.label+'</button>';
          }).join('');
        }else if(em.category==='trash'){
          replyButtons='<div class="muted" style="font-size:11px;padding:8px 0">no reply needed (trash)</div>';
        }
        actionBlock=summBlock+(replyButtons?'<div style="margin-bottom:8px"><div class="sl" style="margin-bottom:6px">suggested replies</div>'+replyButtons+'</div>':'');

        // Compose box if we're drafting
        if(S.composingReply&&S.composingReply.emailId===em.id){
          var draft=(S.composingReply.body||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          actionBlock+='<div style="border:0.5px solid #7F77DD55;border-radius:10px;padding:12px;background:#7F77DD08;margin-top:10px"><div class="sl" style="margin-bottom:6px;color:#7F77DD">drafting · '+S.composingReply.label+'</div><textarea id="reply-textarea" class="inp" rows="6" style="resize:vertical;line-height:1.55;font-family:inherit;font-size:13px;margin-bottom:8px" oninput="updateComposingBody(this.value)">'+draft+'</textarea><div style="display:flex;gap:6px;flex-wrap:wrap"><button onclick="sendReply(\''+em.id+'\',document.getElementById(\'reply-textarea\').value)" class="btn-primary" style="padding:7px 16px;font-size:12px;border-radius:8px"'+(em.sending?' disabled':'')+'>'+(em.sending?'sending…':'send')+'</button><button onclick="cancelReply()" class="btn-ghost" style="padding:7px 12px;font-size:12px;border-radius:8px">cancel</button></div></div>';
        }
        if(em.sentAt){
          actionBlock+='<div style="font-size:11px;color:#1D9E75;margin-top:10px">↩ replied at '+em.sentAt+'</div>';
        }
      }

      detail='<div class="card" style="border:0.5px solid;border-radius:12px;padding:16px 20px;margin-bottom:14px">'+headBlock+bodyBlock+actionBlock+'</div>';
    }
  }

  return header+addrCard+(detail?detail:'')+listCard;
}

function render(){
  var el=document.getElementById('content');if(!el)return;
  var views={overview:renderOverview,characters:renderCharacters,products:renderProducts,motions:renderMotions,angles:renderAngles,generate:renderGenerator,inbox:renderInbox,earnings:renderEarnings,import:renderImport,tools:renderTools,settings:renderSettings,history:renderHistory};
  el.innerHTML=(views[S.view]||renderOverview)();
  setupDZs();applyTheme();
  document.querySelectorAll('.nav-btn').forEach(function(btn){var map={'overview':'overview','characters':'characters','products':'products','motions':'motions','angles':'angles','generate':'generate','earnings':'earnings','import data':'import','tools':'tools','settings':'settings','history':'history'};btn.classList.toggle('active',map[btn.textContent.trim()]===S.view);});
}

function setupDZs(){
  document.querySelectorAll('.dz').forEach(function(dz){
    var id=dz.getAttribute('data-id');if(!id)return;
    dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('over');});
    dz.addEventListener('dragleave',function(e){if(!dz.contains(e.relatedTarget))dz.classList.remove('over');});
    dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('over');var f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))saveImg(f,id);});
    dz.addEventListener('click',function(){var fi=document.getElementById('fi-'+id);if(fi)fi.click();});
    dz.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){var fi=document.getElementById('fi-'+id);if(fi)fi.click();}});
    dz.addEventListener('paste',function(e){var it=(e.clipboardData||window.clipboardData).items;for(var i=0;i<it.length;i++){if(it[i].type.startsWith('image/')){e.preventDefault();saveImg(it[i].getAsFile(),id);break;}}});
  });
}

function saveImg(file,id){
  var reader=new FileReader();
  reader.onload=async function(e){
    var raw=e.target.result;
    // Compress at upload time so localStorage doesn't silently overflow.
    // Stored copy: 1024px max, JPEG 0.8 — already plenty for thumbnails AND
    // matches what we'd send to Higgsfield, so no double work at generate time.
    var data;
    try{data=await compressImageForUpload(raw,1024,0.8);}
    catch(err){console.warn('upload compression failed, using original:',err);data=raw;}
    if(id==='modal-bg'){S.pendingBgImg=data;updPrev('modal-dz-preview',data,'dz-modal-bg');return;}
    if(id==='modal-prod'){S.pendingProdImg=data;updPrev('modal-prod-preview',data,'dz-modal-prod');return;}
    if(id==='modal-motion'){S.pendingMotionImg=data;updPrev('modal-motion-preview',data,'dz-modal-motion');return;}
    if(id==='modal-angle'){S.pendingAngleImg=data;updPrev('modal-angle-preview',data,'dz-modal-angle');return;}
    if(id==='modal-mi'){S.pendingMiImg=data;updPrev('modal-mi-preview',data,'dz-modal-mi');return;}
    if(id.startsWith('bg-')){var b=S.backgrounds.find(function(x){return x.id===parseInt(id.replace('bg-',''));});if(b){commitBgEditFields(b.id);b.imageData=data;save();render();}return;}
    if(id.startsWith('mi-')){var mi=S.modelImages.find(function(x){return x.id===parseInt(id.replace('mi-',''));});if(mi){commitMiEditFields(mi.id);mi.imageData=data;save();render();}return;}
    if(id.startsWith('prod-')){var p=S.products.find(function(x){return x.id===parseInt(id.replace('prod-',''));});if(p){commitProductEditFields(p.id);p.imageData=data;save();render();}return;}
    if(id.startsWith('motion-')){var m=S.motions.find(function(x){return x.id===parseInt(id.replace('motion-',''));});if(m){libCommitEditFields('motions',m.id);m.imageData=data;save();render();}return;}
    if(id.startsWith('angle-')){var a=S.angles.find(function(x){return x.id===parseInt(id.replace('angle-',''));});if(a){libCommitEditFields('angles',a.id);a.imageData=data;save();render();}return;}
  };
  reader.readAsDataURL(file);
}
function updPrev(prevId,data,dzId){var prev=document.getElementById(prevId);if(prev)prev.innerHTML='<img src="'+data+'" style="width:100%;height:100%;object-fit:cover;border-radius:6px">';var dz=document.getElementById(dzId);if(dz)dz.classList.add('has-img');}
function fic(input,id){if(input.files[0])saveImg(input.files[0],id);}

function execDel(type,id,name){
  var snap,u,r;
  if(type==='video'){snap=JSON.stringify(S.videos.find(function(v){return v.id===id;}));S.videos=S.videos.filter(function(v){return v.id!==id;});u=function(){S.videos.push(JSON.parse(snap));};r=function(){S.videos=S.videos.filter(function(v){return v.id!==id;});};}
  else if(type==='product'){snap=JSON.stringify(S.products.find(function(p){return p.id===id;}));S.products=S.products.filter(function(p){return p.id!==id;});var pcp=pruneFavRefs('products',id);u=function(){S.products.push(JSON.parse(snap));restoreFavRefs('products',id,pcp);};r=function(){S.products=S.products.filter(function(p){return p.id!==id;});pruneFavRefs('products',id);};}
  else if(type==='bg'){snap=JSON.stringify(S.backgrounds.find(function(b){return b.id===id;}));S.backgrounds=S.backgrounds.filter(function(b){return b.id!==id;});var bcp=pruneFavRefs('backgrounds',id);u=function(){S.backgrounds.push(JSON.parse(snap));restoreFavRefs('backgrounds',id,bcp);};r=function(){S.backgrounds=S.backgrounds.filter(function(b){return b.id!==id;});pruneFavRefs('backgrounds',id);};}
  else if(type==='bgtag'){var ob=S.bgTags.slice();S.bgTags=S.bgTags.filter(function(t){return t!==name;});S.backgrounds.forEach(function(b){b.tags=(b.tags||[]).filter(function(t){return t!==name;});});u=function(){S.bgTags=ob;};r=function(){S.bgTags=S.bgTags.filter(function(t){return t!==name;});};}
  else if(type==='prodtag'){var op=S.prodTags.slice();S.prodTags=S.prodTags.filter(function(t){return t!==name;});S.products.forEach(function(p){p.tags=(p.tags||[]).filter(function(t){return t!==name;});});u=function(){S.prodTags=op;};r=function(){S.prodTags=S.prodTags.filter(function(t){return t!==name;});};}
  else if(type==='cat'){var oc=S.prodCats.slice();S.prodCats=S.prodCats.filter(function(c){return c!==name;});S.products.forEach(function(p){if(p.category===name)p.category='uncategorized';});u=function(){S.prodCats=oc;};r=function(){S.prodCats=S.prodCats.filter(function(c){return c!==name;});};}
  else if(type==='motion'){snap=JSON.stringify(S.motions.find(function(x){return x.id===id;}));S.motions=S.motions.filter(function(x){return x.id!==id;});var mcp=pruneFavRefs('motions',id);u=function(){S.motions.push(JSON.parse(snap));restoreFavRefs('motions',id,mcp);};r=function(){S.motions=S.motions.filter(function(x){return x.id!==id;});pruneFavRefs('motions',id);};}
  else if(type==='angle'){snap=JSON.stringify(S.angles.find(function(x){return x.id===id;}));S.angles=S.angles.filter(function(x){return x.id!==id;});var acp=pruneFavRefs('angles',id);u=function(){S.angles.push(JSON.parse(snap));restoreFavRefs('angles',id,acp);};r=function(){S.angles=S.angles.filter(function(x){return x.id!==id;});pruneFavRefs('angles',id);};}
  else if(type==='motiontag'){var omt=S.motionTags.slice();S.motionTags=S.motionTags.filter(function(t){return t!==name;});S.motions.forEach(function(m){m.tags=(m.tags||[]).filter(function(t){return t!==name;});});u=function(){S.motionTags=omt;};r=function(){S.motionTags=S.motionTags.filter(function(t){return t!==name;});};}
  else if(type==='angletag'){var oat=S.angleTags.slice();S.angleTags=S.angleTags.filter(function(t){return t!==name;});S.angles.forEach(function(a){a.tags=(a.tags||[]).filter(function(t){return t!==name;});});u=function(){S.angleTags=oat;};r=function(){S.angleTags=S.angleTags.filter(function(t){return t!==name;});};}
  else if(type==='modelImage'){snap=JSON.stringify(S.modelImages.find(function(x){return x.id===id;}));S.modelImages=S.modelImages.filter(function(x){return x.id!==id;});if(S.gen&&S.gen.modelImage===id)S.gen.modelImage=null;u=function(){S.modelImages.push(JSON.parse(snap));};r=function(){S.modelImages=S.modelImages.filter(function(x){return x.id!==id;});if(S.gen&&S.gen.modelImage===id)S.gen.modelImage=null;};}
  else if(type==='mitag'){var omi=S.modelImageTags.slice();S.modelImageTags=S.modelImageTags.filter(function(t){return t!==name;});S.modelImages.forEach(function(mi){mi.tags=(mi.tags||[]).filter(function(t){return t!==name;});});u=function(){S.modelImageTags=omi;};r=function(){S.modelImageTags=S.modelImageTags.filter(function(t){return t!==name;});};}
  if(u&&r)pushUndo(u,r,'deleted '+type+': '+name);
  logH('delete','deleted '+type+': '+name);showToast('deleted: '+name,'red');

}

function openModal(type){
  S.pendingBgImg=null;S.pendingProdImg=null;S.pendingMotionImg=null;S.pendingAngleImg=null;S.pendingMiImg=null;

  else if(type==='modelImage'){var chars3=activeChars();inner=hdr('add model image')+'<div style="display:flex;flex-direction:column;gap:11px"><div>'+lbl('character')+'<select id="mi-char" class="inp">'+chars3.map(function(c){return '<option value="'+c.id+'">'+c.name+'</option>';}).join('')+'</select></div><div>'+lbl('model image name')+'<input type="text" id="mi-name" class="inp" placeholder="e.g. Lena Portrait Front"></div><div>'+lbl('tags')+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:4px">'+S.modelImageTags.map(function(t){return '<label style="display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;padding:3px 0;color:var(--text)"><input type="checkbox" class="mi-tag" value="'+t+'" style="width:auto;accent-color:#7F77DD"> '+t+'</label>';}).join('')+'</div></div><div>'+lbl('image (recommended)')+'<div id="dz-modal-mi" data-id="modal-mi" class="dz" tabindex="0" style="'+dzS+'"><div id="modal-mi-preview" style="position:absolute;inset:0;border-radius:6px;overflow:hidden;pointer-events:none"></div><div style="font-size:12px;position:relative;z-index:1">drop image here</div><div style="font-size:11px;opacity:0.5;position:relative;z-index:1">click to browse · cmd+v</div></div><input type="file" accept="image/*" id="fi-modal-mi" style="display:none" onchange="fic(this,\'modal-mi\')"></div><button onclick="submitModelImage()" class="btn-primary" style="width:100%;padding:10px;font-size:13px;border-radius:8px">add model image</button></div>';}
  else if(type==='character'){inner=hdr('add character')+'<div style="display:flex;flex-direction:column;gap:11px"><div>'+lbl('character name')+'<input type="text" id="char-name" class="inp" placeholder="e.g. Sofia"></div><div>'+lbl('accent color')+'<input type="color" id="char-color" value="#7F77DD" class="inp" style="height:38px;cursor:pointer;padding:2px"></div><button onclick="submitCharacter()" class="btn-primary" style="width:100%;padding:10px;font-size:13px;border-radius:8px">add character</button></div>';}
  else if(type==='motion'||type==='angle'){
    var label=type==='motion'?'motion':'camera angle';
    var dzMod='modal-'+type;
    var ex=type==='motion'?'e.g. she walks confidently toward camera, slight sway, hand on hip':'e.g. low-angle wide shot from hip height, slight upward tilt, full body in frame';
    var phName=type==='motion'?'Walking Toward Camera':'Low-Angle Wide';
    var fn=type==='motion'?'submitMotion':'submitAngle';
    inner=hdr('add '+label)+'<div style="display:flex;flex-direction:column;gap:11px"><div>'+lbl(label+' name')+'<input type="text" id="lib-name" class="inp" placeholder="e.g. '+phName+'"></div><div>'+lbl('prompt snippet (optional)')+'<textarea id="lib-prompt" class="inp" rows="3" style="resize:vertical;line-height:1.5;font-family:monospace;font-size:12px" placeholder="'+ex+'"></textarea></div><div>'+lbl('preview image (optional)')+'<div id="dz-'+dzMod+'" data-id="'+dzMod+'" class="dz" tabindex="0" style="'+dzS+'"><div id="'+dzMod+'-preview" style="position:absolute;inset:0;border-radius:6px;overflow:hidden;pointer-events:none"></div><div style="font-size:12px;position:relative;z-index:1">drop image here</div><div style="font-size:11px;opacity:0.5;position:relative;z-index:1">click to browse · cmd+v</div></div><input type="file" accept="image/*" id="fi-'+dzMod+'" style="display:none" onchange="fic(this,\''+dzMod+'\')"></div><button onclick="'+fn+'()" class="btn-primary" style="width:100%;padding:10px;font-size:13px;border-radius:8px">add '+label+'</button></div>';
  }
  document.getElementById('modal-inner').innerHTML=inner;setupDZs();
}

function submitVideo(){var char=document.getElementById('m-char')?.value,title=document.getElementById('m-title')?.value?.trim(),date=document.getElementById('m-date')?.value,bg=document.getElementById('m-bg')?.value?.trim();var ic=parseInt(document.getElementById('m-ic')?.value)||0,icr=parseInt(document.getElementById('m-icr')?.value)||0,vc=parseInt(document.getElementById('m-vc')?.value)||0,vcr=parseInt(document.getElementById('m-vcr')?.value)||0;var links=Array.from(document.querySelectorAll('.m-link')).map(function(i){return i.value.trim();}).filter(Boolean);if(!title&&!bg){alert('Add a video title or background');return;}var v={id:Date.now(),character:char,title:title,date:date,productLinks:links,background:bg,imageCount:ic,imageCredits:icr,videoCount:vc,videoCredits:vcr,posted:null};S.videos.push(v);if(bg&&char)autoCreateBg(char,bg);autoImportProducts(v);var vid=v.id;pushUndo(function(){S.videos=S.videos.filter(function(x){return x.id!==vid;});},function(){S.videos.push(v);},'added video: '+(title||bg));logH('add','added video: '+(title||bg));save();closeModal();render();}
function submitProduct(){var name=document.getElementById('p-name')?.value?.trim(),link=document.getElementById('p-link')?.value?.trim(),cat=document.getElementById('p-cat')?.value||'uncategorized';if(!name||!link){alert('Fill in name and link');return;}if(S.products.find(function(p){return p.link===link;})){alert('Link already exists');return;}var p={id:Date.now(),name:name,link:link,category:cat,tags:[],imageData:S.pendingProdImg||null,dateAdded:new Date().toISOString().split('T')[0]};S.products.push(p);var pid=p.id;pushUndo(function(){S.products=S.products.filter(function(x){return x.id!==pid;});},function(){S.products.push(p);},'added product: '+name);logH('add','added product: '+name);save();closeModal();render();}
function submitBackground(){var char=document.getElementById('bg-char')?.value,name=document.getElementById('bg-name')?.value?.trim();var tags=Array.from(document.querySelectorAll('.bg-tag:checked')).map(function(cb){return cb.value;});if(!name){alert('Enter a background name');return;}var ex=fuzzy(name,S.backgrounds.filter(function(b){return b.character===char;}));if(ex&&!confirm('"'+ex.name+'" looks similar. Add anyway?'))return;var b={id:Date.now(),character:char,name:name,tags:tags,imageData:S.pendingBgImg||null,dateAdded:new Date().toISOString().split('T')[0]};S.backgrounds.push(b);var bid=b.id;pushUndo(function(){S.backgrounds=S.backgrounds.filter(function(x){return x.id!==bid;});},function(){S.backgrounds.push(b);},'added background: '+name);logH('add','added background: '+name);save();closeModal();render();}
function submitModelImage(){var char=document.getElementById('mi-char')?.value,name=document.getElementById('mi-name')?.value?.trim();var tags=Array.from(document.querySelectorAll('.mi-tag:checked')).map(function(cb){return cb.value;});if(!name){alert('Enter a model image name');return;}if(!char){alert('Pick a character');return;}var mi={id:Date.now(),character:char,name:name,tags:tags,imageData:S.pendingMiImg||null,dateAdded:new Date().toISOString().split('T')[0]};S.modelImages.push(mi);var mid=mi.id;pushUndo(function(){S.modelImages=S.modelImages.filter(function(x){return x.id!==mid;});},function(){S.modelImages.push(mi);},'added model image: '+name);logH('add','added model image: '+name);save();closeModal();render();}
function submitCharacter(){var name=document.getElementById('char-name')?.value?.trim(),color=document.getElementById('char-color')?.value||'#7F77DD';if(!name){alert('Enter a name');return;}var id=name.toLowerCase().replace(/\s+/g,'_');if(S.characters.find(function(c){return c.id===id;})){alert('Already exists');return;}var c={id:id,name:name,color:color,archived:false,description:'',mailingAddress:'',favorites:{products:[],backgrounds:[],motions:[],angles:[]}};S.characters.push(c);pushUndo(function(){S.characters=S.characters.filter(function(x){return x.id!==id;});},function(){S.characters.push(c);},'added character: '+name);logH('add','added character: '+name);save();closeModal();render();}

function doImport(){
  var raw=document.getElementById('import-ta')?.value?.trim();var msg=document.getElementById('import-msg');
  if(!raw){if(msg)msg.innerHTML='<span style="color:#e24b4a">nothing to import</span>';return;}
  var data;
  try{data=JSON.parse(raw);}catch(e){if(msg)msg.innerHTML='<span style="color:#e24b4a">invalid json — check format and try again</span>';return;}

  // Detect full backup (has any collection besides videos) vs end-of-day extraction
  var isBackup=Array.isArray(data.characters)||Array.isArray(data.products)||Array.isArray(data.backgrounds)||Array.isArray(data.bgTags)||Array.isArray(data.prodCats)||Array.isArray(data.prodTags)||Array.isArray(data.dailyLedger)||Array.isArray(data.motions)||Array.isArray(data.angles)||Array.isArray(data.motionTags)||Array.isArray(data.angleTags)||Array.isArray(data.blueprints)||Array.isArray(data.modelImages)||Array.isArray(data.modelImageTags);

  if(isBackup){
    var prev={videos:S.videos.slice(),products:S.products.slice(),backgrounds:S.backgrounds.slice(),characters:S.characters.slice(),bgTags:S.bgTags.slice(),prodCats:S.prodCats.slice(),prodTags:S.prodTags.slice(),dailyLedger:S.dailyLedger.slice(),motions:S.motions.slice(),angles:S.angles.slice(),motionTags:S.motionTags.slice(),angleTags:S.angleTags.slice(),blueprints:S.blueprints.slice(),modelImages:S.modelImages.slice(),modelImageTags:S.modelImageTags.slice()};
    var apply=function(){
      if(Array.isArray(data.videos))S.videos=data.videos.slice();
      if(Array.isArray(data.products))S.products=data.products.slice();
      if(Array.isArray(data.backgrounds))S.backgrounds=data.backgrounds.slice();
      if(Array.isArray(data.characters))S.characters=data.characters.slice();
      if(Array.isArray(data.bgTags))S.bgTags=data.bgTags.slice();
      if(Array.isArray(data.prodCats))S.prodCats=data.prodCats.slice();
      if(Array.isArray(data.prodTags))S.prodTags=data.prodTags.slice();
      if(Array.isArray(data.dailyLedger))S.dailyLedger=data.dailyLedger.slice();
      if(Array.isArray(data.motions))S.motions=data.motions.slice();
      if(Array.isArray(data.angles))S.angles=data.angles.slice();
      if(Array.isArray(data.motionTags))S.motionTags=data.motionTags.slice();
      if(Array.isArray(data.angleTags))S.angleTags=data.angleTags.slice();
      if(Array.isArray(data.blueprints))S.blueprints=data.blueprints.slice();
      if(Array.isArray(data.modelImages))S.modelImages=data.modelImages.slice();
      if(Array.isArray(data.modelImageTags))S.modelImageTags=data.modelImageTags.slice();
      S.characters.forEach(function(c){if(c.archived===undefined)c.archived=false;});
      S.products.forEach(function(p){if(!p.tags)p.tags=[];});
      S.backgrounds.forEach(function(b){if(!b.tags)b.tags=[];});
      S.modelImages.forEach(function(mi){if(!Array.isArray(mi.tags))mi.tags=[];});
      S.motions.forEach(function(m){if(!Array.isArray(m.tags))m.tags=[];if(typeof m.promptSnippet!=='string')m.promptSnippet='';});
      S.angles.forEach(function(a){if(!Array.isArray(a.tags))a.tags=[];if(typeof a.promptSnippet!=='string')a.promptSnippet='';});
    };
    showConf('restore from backup?','this will <strong>replace all current data</strong> ('+S.videos.length+' videos, '+S.products.length+' products, '+S.backgrounds.length+' backgrounds) with the backup ('+(data.videos||[]).length+' videos, '+(data.products||[]).length+' products, '+(data.backgrounds||[]).length+' backgrounds). undo with cmd+z if needed.',function(){
      apply();
      pushUndo(function(){S.videos=prev.videos;S.products=prev.products;S.backgrounds=prev.backgrounds;S.characters=prev.characters;S.bgTags=prev.bgTags;S.prodCats=prev.prodCats;S.prodTags=prev.prodTags;S.dailyLedger=prev.dailyLedger;S.motions=prev.motions;S.angles=prev.angles;S.motionTags=prev.motionTags;S.angleTags=prev.angleTags;S.blueprints=prev.blueprints;S.modelImages=prev.modelImages;S.modelImageTags=prev.modelImageTags;},apply,'restore backup');
      save();
      var summary='restored '+S.videos.length+' video'+(S.videos.length!==1?'s':'')+' · '+S.products.length+' product'+(S.products.length!==1?'s':'')+' · '+S.backgrounds.length+' background'+(S.backgrounds.length!==1?'s':'');
      if(msg)msg.innerHTML='<span style="color:#1D9E75">'+summary+'</span>';
      logH('import','restore backup: '+summary);
      showToast('backup restored','green');
      render();
    },'restore','#7F77DD');
    return;
  }

  // End-of-day extraction: merge videos and (optionally) daily credits
  var hasVideos=Array.isArray(data.videos)&&data.videos.length;
  var hasCredits=data.credits!=null;
  if(!hasVideos&&!hasCredits){if(msg)msg.innerHTML='<span style="color:#BA7517">no videos or credits found — expected {"videos":[...]} and/or {"credits":{...}}</span>';return;}
  try{
    var aV=[],aB=[],aP=[],aL=[];
    if(hasVideos){
      data.videos.forEach(function(v){
        var charMatch=findCharacter(v.character);
        if(charMatch)v.character=charMatch.id;
        v.id=Date.now()+Math.floor(Math.random()*99999);if(!v.tags)v.tags=[];
        v.posted=normalizePosted(v.posted);
        if(v.revenue!=null){var rn=Number(v.revenue);v.revenue=isNaN(rn)?null:rn;}else{v.revenue=null;}
        ['views','likes','comments','shares','saves'].forEach(function(k){if(v[k]!=null){var n=Number(v[k]);v[k]=isNaN(n)?null:n;}else{v[k]=null;}});
        S.videos.push(v);aV.push(v.id);
        if(v.background&&v.character){var nb=autoCreateBg(v.character,v.background);if(nb)aB.push(nb.id);}
        var np=autoImportProducts(v);np.forEach(function(p){aP.push(p.id);});
      });
    }
    if(hasCredits){
      var creditsList=Array.isArray(data.credits)?data.credits:[data.credits];
      creditsList.forEach(function(cr){
        if(!cr||typeof cr!=='object')return;
        var charMatch=findCharacter(cr.character);
        if(!charMatch)return;
        var date=cr.date||todayStr();
        function num(v){if(v==null||v==='')return null;var n=Number(v);return isNaN(n)?null:n;}
        var sb=num(cr.startBalance!=null?cr.startBalance:cr.start);
        var eb=num(cr.endBalance!=null?cr.endBalance:cr.end);
        var gmv=num(cr.gmv);var items=num(cr.itemsSold!=null?cr.itemsSold:cr.items);var commission=num(cr.commission);
        var existing=getDailyEntry(charMatch.id,date);
        var hadBefore=!!existing;
        var prevSnap=existing?{startBalance:existing.startBalance,endBalance:existing.endBalance,gmv:existing.gmv,itemsSold:existing.itemsSold,commission:existing.commission,note:existing.note}:null;
        var patch={};if(sb!=null)patch.startBalance=sb;if(eb!=null)patch.endBalance=eb;if(gmv!=null)patch.gmv=gmv;if(items!=null)patch.itemsSold=items;if(commission!=null)patch.commission=commission;if(cr.note)patch.note=String(cr.note);
        var entry=upsertDailyEntry(charMatch.id,date,patch);
        aL.push({id:entry.id,charId:charMatch.id,date:date,hadBefore:hadBefore,prev:prevSnap});
      });
    }
    var sv=aV.slice(),sb2=aB.slice(),sp=aP.slice(),sl=aL.slice();
    pushUndo(function(){
      S.videos=S.videos.filter(function(v){return sv.indexOf(v.id)===-1;});
      S.backgrounds=S.backgrounds.filter(function(b){return sb2.indexOf(b.id)===-1;});
      S.products=S.products.filter(function(p){return sp.indexOf(p.id)===-1;});
      sl.forEach(function(rec){if(!rec.hadBefore){S.dailyLedger=S.dailyLedger.filter(function(e){return e.id!==rec.id;});}else{var e=getDailyEntry(rec.charId,rec.date);if(e&&rec.prev)Object.assign(e,rec.prev);}});
    },function(){},'import: '+aV.length+' videos · '+aL.length+' ledger');
    save();var parts=[];
    if(aV.length)parts.push('imported '+aV.length+' video'+(aV.length!==1?'s':''));
    if(sb2.length)parts.push(sb2.length+' background'+(sb2.length>1?'s':'')+' created');
    if(sp.length)parts.push(sp.length+' product'+(sp.length>1?'s':'')+' → uncategorized');
    if(aL.length)parts.push(aL.length+' ledger entr'+(aL.length>1?'ies':'y')+' updated');
    if(!parts.length)parts.push('nothing imported');
    if(msg)msg.innerHTML='<span style="color:#1D9E75">'+parts.join(' · ')+'</span>';
    logH('import',parts.join(', '));render();
  }catch(e){if(msg)msg.innerHTML='<span style="color:#e24b4a">import failed: '+(e.message||'unknown error')+'</span>';}
}

function setPF(cat){S.pf=cat;S.editingProduct=null;render();}
function setPTF(tag){S.ptf=tag;render();}
function addBgTagSetting(){var i=document.getElementById('new-bgtag');if(!i)return;var v=i.value.trim();if(v&&!S.bgTags.includes(v)){S.bgTags.push(v);logH('add','added bg tag: '+v);save();render();}i.value='';}
function addProdTagSetting(){var i=document.getElementById('new-prodtag');if(!i)return;var v=i.value.trim();if(v&&!S.prodTags.includes(v)&&v!=='all'){S.prodTags.push(v);logH('add','added product tag: '+v);save();render();}i.value='';}
function addCat(){var i=document.getElementById('new-cat');if(!i)return;var v=i.value.trim();if(v&&!S.prodCats.includes(v)&&v!=='uncategorized'){S.prodCats.push(v);logH('add','added category: '+v);save();render();}i.value='';}

load();render();
</script>
</body>
</html>
